  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Files selected are held here until the employee is saved (create or update),
  // since a brand-new employee doesn't have an ID yet to attach files to.
  let pendingUploads = {};

  function wireDocUploadTrigger(slot, options = {}) {
    const btn = document.getElementById(`uploadBtn_${slot}`);
    const input = document.getElementById(`upload_${slot}`);
    if (!btn || !input) return;
    btn.addEventListener('click', () => input.click());
    input.addEventListener('change', async (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      const base64 = await fileToBase64(file);
      const ext = file.name.split('.').pop().toLowerCase();
      pendingUploads[slot] = { base64, ext, document_name: options.documentName || slot };
      if (options.isPhoto) {
        document.getElementById('photoStatusInput').value = `Selected: ${file.name} (will save with the form)`;
        document.getElementById('photoPreviewBox').innerHTML = `<img src="${base64}" style="width:38px; height:38px; object-fit:cover; border-radius:6px; border:1px solid var(--border);" />`;
      } else {
        const status = document.getElementById(`uploadStatus_${slot}`);
        if (status) status.textContent = `Selected: ${file.name} (will save with the form)`;
      }
    });
  }

  function setupDocumentUploadTriggers(documents) {
    pendingUploads = {};
    wireDocUploadTrigger('photo', { isPhoto: true });
    wireDocUploadTrigger('aadhar');
    wireDocUploadTrigger('driving_license');
    wireDocUploadTrigger('pf_certificate');
    wireDocUploadTrigger('esi_certificate');
  }

  // Inline single-row "Add" form + ledger table with Edit/Delete, matching HR Dropdowns pattern
  function setupRepeatableSection(containerId, initialRows, fields, addLabel) {
    const container = document.getElementById(containerId);
    let rows = initialRows.length > 0 ? [...initialRows] : [];
    let editingIndex = null;
    let formOpen = false;

    function fieldInputHtml(f, val) {
      if (f.type === 'select') {
        return `<select data-key="${f.key}" style="min-width:140px;">${opt(f.options, val)}</select>`;
      }
      if (f.type === 'checkbox') {
        return `<label style="display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--muted); white-space:nowrap; padding-bottom:10px;"><input type="checkbox" data-key="${f.key}" ${val ? 'checked' : ''} style="width:auto;" />${f.label}</label>`;
      }
      return `<input type="${f.type || 'text'}" data-key="${f.key}" value="${val ?? ''}" placeholder="${f.label}" style="min-width:130px;" />`;
    }

    function displayVal(f, row) {
      if (f.type === 'select') return (f.options || []).find(o => o.id === row[f.key])?.name || '—';
      if (f.type === 'checkbox') return row[f.key] ? 'Yes' : 'No';
      return row[f.key] || '—';
    }

    function render() {
      const editingRow = editingIndex !== null ? rows[editingIndex] : {};
      const showForm = formOpen || editingIndex !== null;

      const formRowHtml = showForm ? `
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:end; padding:14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; margin-bottom:12px;">
          ${fields.map(f => {
            const val = f.type === 'checkbox' ? editingRow[f.key] : (editingRow[f.key] ?? '');
            const label = (f.required ? f.label + ' *' : f.label);
            return `<div class="field" style="margin-bottom:0;">${f.type !== 'checkbox' ? `<label>${label}</label>` : ''}${fieldInputHtml(f, val)}</div>`;
          }).join('')}
          <button type="button" class="btn btn-sm" id="${containerId}-addBtn">${editingIndex !== null ? 'Update' : 'Add'}</button>
          <button type="button" class="btn btn-sm btn-outline" id="${containerId}-cancelEditBtn">Cancel</button>
        </div>` : `
        <button type="button" class="btn btn-sm btn-outline" id="${containerId}-openBtn" style="margin-bottom:12px;">+ ${addLabel || 'Add'}</button>`;

      const tableHtml = `
        <div class="table-scroll">
          <table class="ledger"><thead><tr>
            ${fields.map(f => `<th>${f.label}</th>`).join('')}<th>Action</th>
          </tr></thead><tbody>
            ${rows.length === 0 ? `<tr><td colspan="${fields.length + 1}" style="text-align:center; color:var(--muted); padding:16px;">None added yet.</td></tr>` : rows.map((row, idx) => `
              <tr>
                ${fields.map(f => `<td data-label="${f.label}">${displayVal(f, row)}</td>`).join('')}
                <td data-label="Action" class="action-cell">
                  <div style="display:flex; gap:4px;">
                    <button type="button" class="icon-btn ${containerId}-editBtn" data-idx="${idx}" title="Edit">${ACTION_ICONS.edit}</button>
                    <button type="button" class="icon-btn icon-btn-danger ${containerId}-deleteBtn" data-idx="${idx}" title="Delete">${ACTION_ICONS.exit}</button>
                  </div>
                </td>
              </tr>`).join('')}
          </tbody></table>
        </div>`;

      container.innerHTML = formRowHtml + tableHtml;

      document.getElementById(`${containerId}-openBtn`)?.addEventListener('click', () => {
        formOpen = true;
        render();
      });

      document.getElementById(`${containerId}-addBtn`)?.addEventListener('click', () => {
        const newRow = {};
        fields.forEach(f => {
          const input = container.querySelector(`[data-key="${f.key}"]`);
          if (!input) return;
          newRow[f.key] = f.type === 'checkbox' ? input.checked : input.value.trim();
        });

        // Block entirely blank rows
        const anyFilled = fields.some(f => {
          const v = newRow[f.key];
          return f.type === 'checkbox' ? false : !!v;
        });
        if (!anyFilled) {
          alert('Please fill in at least the required fields before adding.');
          return;
        }
        // Block if a required field is missing
        const missingRequired = fields.find(f => f.required && !newRow[f.key]);
        if (missingRequired) {
          alert(`"${missingRequired.label}" is required.`);
          return;
        }

        if (editingIndex !== null) {
          rows[editingIndex] = newRow;
          editingIndex = null;
        } else {
          rows.push(newRow);
        }
        formOpen = false;
        render();
      });

      document.getElementById(`${containerId}-cancelEditBtn`)?.addEventListener('click', () => {
        editingIndex = null;
        formOpen = false;
        render();
      });

      container.querySelectorAll(`.${containerId}-editBtn`).forEach(btn => {
        btn.addEventListener('click', () => {
          editingIndex = Number(btn.dataset.idx);
          render();
        });
      });
      container.querySelectorAll(`.${containerId}-deleteBtn`).forEach(btn => {
        btn.addEventListener('click', () => {
          if (!confirm('Remove this entry?')) return;
          rows.splice(Number(btn.dataset.idx), 1);
          if (editingIndex === Number(btn.dataset.idx)) editingIndex = null;
          render();
        });
      });
    }

    container.getRows = () => rows;
    render();
  }


  async function saveEmployeeForm(employeeId, existingDocs) {
    const btn = document.getElementById('saveEmployeeBtn');
    const msg = document.getElementById('employeeFormMsg');
    msg.className = 'msg';
    existingDocs = existingDocs || [];

    const val = (id) => document.getElementById(id)?.value || null;
    const checked = (id) => document.getElementById(id)?.checked || false;
    const hasDoc = (slot) => !!pendingUploads[slot] || existingDocs.some(d => d.slot === slot);

    const vehicleApplicable = checked('f_vehicle_km_applicable');
    const hasDrivingLicense = checked('f_has_driving_license');
    const pfApplicable = checked('f_pf_applicable');
    const esiApplicable = checked('f_esi_applicable');
    const paymentMethod = val('f_salary_payment_method') || 'cash';

    const core = {
      employee_code: val('f_employee_code'),
      name: val('f_name'),
      mobile_number: val('f_mobile_number'),
      role: val('f_role'),
      branch_id: val('f_branch_id') || null,
      department_id: val('f_department_id') || null,
      designation_id: val('f_designation_id') || null,
      employee_category_id: val('f_employee_category_id') || null,
      date_of_joining: val('f_date_of_joining'),
      wage_type: val('f_wage_type'),
      source_of_employee: val('f_source_of_employee') || null,
      father_husband_name: val('f_father_husband_name'),
      marital_status: val('f_marital_status'),
      religion: val('f_religion'),
      gender: val('f_gender'),
      date_of_birth: val('f_date_of_birth'),
      blood_group: val('f_blood_group'),
      place_of_birth: val('f_place_of_birth'),
      aadhar_no: val('f_aadhar_no'),
      father_husband_relation: val('f_father_husband_relation'),
      present_address: val('f_present_address'),
      present_city_id: val('f_present_city_id') || null,
      present_state_id: val('f_present_state_id') || null,
      present_pincode: val('f_present_pincode'),
      permanent_address: val('f_permanent_address'),
      permanent_city_id: val('f_permanent_city_id') || null,
      permanent_state_id: val('f_permanent_state_id') || null,
      permanent_pincode: val('f_permanent_pincode'),
      tel_home: val('f_tel_home'),
      driving_license_number: hasDrivingLicense ? val('f_driving_license_number') : null,
      driving_license_category: hasDrivingLicense ? val('f_driving_license_category') : null,
      driving_license_validity: hasDrivingLicense ? val('f_driving_license_validity') : null,
      emergency_contact_name: val('f_emergency_contact_name'),
      emergency_contact_relation: val('f_emergency_contact_relation'),
      emergency_contact_mobile: val('f_emergency_contact_mobile'),
      emergency_contact_address: val('f_emergency_contact_address'),
      salary_payment_method: paymentMethod,
      bank_name: val('f_bank_name'),
      bank_account_number: val('f_bank_account_number'),
      bank_ifsc: val('f_bank_ifsc'),
      bank_branch: val('f_bank_branch'),
      bank_account_holder_name: val('f_bank_account_holder_name'),
      pan_number: val('f_pan_number'),
      uan_number: val('f_uan_number'),
      salary_basic: val('f_salary_basic'),
      salary_hra: val('f_salary_hra'),
      salary_da: val('f_salary_da'),
      salary_ta: val('f_salary_ta'),
      salary_esi: val('f_salary_esi') === 'true',
      pf_applicable: pfApplicable,
      pf_number: pfApplicable ? val('f_pf_number') : null,
      esi_applicable: esiApplicable,
      esi_number: esiApplicable ? val('f_esi_number') : null,
      vehicle_km_applicable: vehicleApplicable,
      vehicle_number: vehicleApplicable ? val('f_vehicle_number') : null,
      rate_per_km: vehicleApplicable ? val('f_rate_per_km') : null,
      has_ref_employee: checked('f_has_ref_employee'),
      ref_employee_name: val('f_ref_employee_name'),
      ref_employee_contact: val('f_ref_employee_contact'),
    };

    // ---------- Mandatory field validation ----------
    const errors = [];
    const err = (label, targetId) => errors.push({ label, targetId });
    if (!core.employee_code) err('Employee Code', 'f_employee_code');
    if (!core.name) err('Full Name', 'f_name');
    if (!core.mobile_number) err('Mobile Number', 'f_mobile_number');
    if (!core.branch_id) err('Branch', 'f_branch_id');
    if (!core.department_id) err('Department', 'f_department_id');
    if (!core.designation_id) err('Designation', 'f_designation_id');
    if (!core.employee_category_id) err('Employee Category', 'f_employee_category_id');
    if (!core.date_of_joining) err('Date of Joining', 'f_date_of_joining');
    if (!core.wage_type) err('Wage Type', 'f_wage_type');
    if (vehicleApplicable) {
      if (!core.vehicle_number) err('Vehicle Number', 'f_vehicle_number');
      if (!core.rate_per_km) err('Rate per KM', 'f_rate_per_km');
      if (!core.driving_license_number) err('Driving License No (required since Vehicle KM is applicable)', 'f_driving_license_number');
      if (!hasDoc('driving_license')) err('Driving License Upload (required since Vehicle KM is applicable)', 'uploadBtn_driving_license');
    }
    if (!core.father_husband_name) err('Father/Husband Name', 'f_father_husband_name');
    if (!core.marital_status) err('Marital Status', 'f_marital_status');
    if (!core.gender) err('Gender', 'f_gender');
    if (!core.date_of_birth) err('Date of Birth', 'f_date_of_birth');
    if (!core.aadhar_no) err('Aadhar No', 'f_aadhar_no');
    if (!hasDoc('aadhar')) err('Aadhar Card Upload', 'uploadBtn_aadhar');
    if (!core.present_address) err('Present Address', 'f_present_address');
    if (!core.present_state_id) err('Present State', 'f_present_state_id');
    if (!core.present_city_id) err('Present City', 'f_present_city_id');
    if (!checked('f_same_as_present')) {
      if (!core.permanent_address) err('Permanent Address', 'f_permanent_address');
      if (!core.permanent_state_id) err('Permanent State', 'f_permanent_state_id');
      if (!core.permanent_city_id) err('Permanent City', 'f_permanent_city_id');
    }
    if (core.driving_license_number && !core.driving_license_validity) err('License Validity (since License No is filled)', 'f_driving_license_validity');
    if (!core.emergency_contact_name) err('Emergency Contact Name', 'f_emergency_contact_name');
    if (!core.emergency_contact_relation) err('Emergency Contact Relation', 'f_emergency_contact_relation');
    if (!core.emergency_contact_mobile) err('Emergency Contact Mobile', 'f_emergency_contact_mobile');
    if (paymentMethod === 'bank') {
      if (!core.bank_name) err('Bank Name (Payment Method = Bank)', 'f_bank_name');
      if (!core.bank_account_number) err('Account Number (Payment Method = Bank)', 'f_bank_account_number');
      if (!core.bank_ifsc) err('IFSC Code (Payment Method = Bank)', 'f_bank_ifsc');
    }
    if (pfApplicable) {
      if (!core.pf_number) err('PF Number', 'f_pf_number');
      if (!core.uan_number) err('UAN Number', 'f_uan_number');
      if (!hasDoc('pf_certificate')) err('PF Certificate Upload', 'uploadBtn_pf_certificate');
    }
    if (esiApplicable) {
      if (!core.esi_number) err('ESI Number', 'f_esi_number');
      if (!hasDoc('esi_certificate')) err('ESI Certificate Upload', 'uploadBtn_esi_certificate');
    }
    if (!core.salary_basic) err('Salary Basic', 'f_salary_basic');
    if (!hasDoc('photo')) err('Photo Upload', 'uploadBtn_photo');
    if (checked('f_has_ref_employee') && !core.ref_employee_name) err('REF Employee Reference (since "Has reference of a REF employee" is checked)', 'f_ref_employee_name');
    const educationRows = document.getElementById('educationRows').getRows();
    if (educationRows.length === 0) err('At least one Education / Qualification entry', 'educationRows');
    const familyRows = document.getElementById('familyRows').getRows();
    familyRows.forEach((r, i) => { if (!r.member_name) err(`Family row ${i + 1}: Name`, 'familyRows'); });
    const workRows = document.getElementById('workRows').getRows();
    workRows.forEach((r, i) => { if (!r.company_name) err(`Work Experience row ${i + 1}: Company Name`, 'workRows'); });

    // Clear any previous error highlighting
    document.querySelectorAll('.field-error-highlight').forEach(el => el.classList.remove('field-error-highlight'));

    if (errors.length > 0) {
      // Highlight every field that has an error
      errors.forEach(e => {
        const el = document.getElementById(e.targetId);
        if (el) el.classList.add('field-error-highlight');
      });

      msg.className = 'msg error';
      msg.innerHTML = 'Please complete the following before saving:<br>• ' + errors.map(e => e.label).join('<br>• ');

      // Jump to and focus the first error field
      const firstEl = document.getElementById(errors[0].targetId);
      if (firstEl) {
        firstEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => firstEl.focus?.(), 350);
      }
      return;
    }

    setButtonLoading(btn, true, 'Saving');

    let empResult;
    if (employeeId) {
      empResult = await apiHR({ action: 'update_employee', employee_id: employeeId, core });
    } else {
      empResult = await apiHR({ action: 'create_employee', core, pin: null });
    }

    if (!empResult.success) {
      msg.className = 'msg error';
      msg.textContent = empResult.error || 'Failed to save employee.';
      setButtonLoading(btn, false);
      return;
    }

    const finalEmployeeId = empResult.employee.id;

    // Save all child record sections
    const childSaves = [
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_family_members', records: familyRows }),
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_education', records: educationRows }),
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_work_experience', records: workRows }),
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_nominees', records: document.getElementById('nomineeRows').getRows() }),
    ];

    // Upload any pending documents now that we have a real employee_id
    const uploadSaves = Object.entries(pendingUploads).map(([slot, data]) =>
      apiHR({ action: 'upload_document', employee_id: finalEmployeeId, slot, file_base64: data.base64, file_ext: data.ext, document_name: data.document_name })
    );

    await Promise.all([...childSaves, ...uploadSaves]);
    pendingUploads = {};

    msg.className = 'msg success';
    msg.textContent = empResult.generatedPin
      ? `Employee saved successfully. Their login PIN is: ${empResult.generatedPin} (last 4 digits of mobile number). Share this with them.`
      : 'Employee saved successfully.';
    const listRes = await apiHR({ action: 'get_employee_list' });
    if (listRes.success) employeeListData = listRes.employees;
    setTimeout(() => renderEmployeeMasterList(), empResult.generatedPin ? 3500 : 800);
  }

  // --- Restore session on page refresh instead of forcing re-login ---
  document.getElementById('logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem('admin_session');
    currentUser = null;
    appShell.style.display = 'none';
    authGate.style.display = 'flex';
  });

  (function restoreSession() {
    const saved = sessionStorage.getItem('admin_session');
    if (!saved) return;
    try {
      currentUser = JSON.parse(saved);
      authGate.style.display = 'none';
      appShell.style.display = 'flex';
      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userRole').textContent = currentUser.role.toUpperCase();
      loadDashboard();
      const savedView = sessionStorage.getItem('admin_active_view');
      if (savedView) switchMainView(savedView);
    } catch (e) {
      sessionStorage.removeItem('admin_session');
    }
  })();

  // ============ ADMIN PANEL: ROLES & PERMISSIONS ============
  const MODULE_LABELS = {
    employee_master: 'Employee Master',
    km_tracker: 'Km Tracker',
    vendor_master: 'Vendor Master',
    vendor_data_bank: 'Vendor Data Bank',
  };
  const ACTION_LABELS = { view: 'View', create: 'Create', edit: 'Edit', approve: 'Approve', delete: 'Delete' };
  let selectedPermEmployeeId = null;

  async function loadAdminPanel() {
    adminPanelLoaded = true;
    const res = await apiPermissions({ action: 'get_permissions_data' });
    if (res.success) {
      permissionsData = res;
    } else {
      document.getElementById('adminPanelContent').innerHTML = `<div class="panel"><div class="panel-body msg error" style="display:block;">${res.error || 'Failed to load.'}</div></div>`;
      return;
    }
    renderAdminPanel();
  }

  function renderAdminPanel() {
    if (!permissionsData) return;
    const { permissions, employees, grants } = permissionsData;
    if (!selectedPermEmployeeId && employees.length > 0) {
      selectedPermEmployeeId = employees.find(e => e.role !== 'owner')?.id || employees[0].id;
    }
    const selectedEmp = employees.find(e => e.id === selectedPermEmployeeId);
    const empGrantedIds = new Set(grants.filter(g => g.employee_id === selectedPermEmployeeId).map(g => g.permission_id));

    const modules = [...new Set(permissions.map(p => p.module))];

    let html = `<div class="panel">
      <div class="panel-header"><span class="panel-title">Roles &amp; Permissions</span></div>
      <div class="panel-body">
        <div style="display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap;">
          <div style="min-width:220px;">
            <label style="display:block; font-size:11px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.4px;">Employee</label>
            <select id="permEmployeeSelect" style="width:100%; max-width:260px;">
              ${employees.map(e => `<option value="${e.id}" ${e.id === selectedPermEmployeeId ? 'selected' : ''}>${e.name}${e.role === 'owner' ? ' (Owner)' : ''}</option>`).join('')}
            </select>
          </div>
        </div>

        ${selectedEmp?.role === 'owner' ? `
          <div class="empty-state" style="margin-top:20px;">
            <strong>${selectedEmp.name}</strong> is the Owner — Owner automatically has full access to everything and can never be restricted. No permissions need to be granted here.
          </div>
        ` : `
          <div style="margin-top:22px;">
            ${modules.map(mod => {
              const modPerms = permissions.filter(p => p.module === mod);
              return `<div style="margin-bottom:20px;">
                <div style="font-size:12.5px; font-weight:650; color:var(--steel); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--border);">${MODULE_LABELS[mod] || mod}</div>
                <div style="display:flex; gap:18px; flex-wrap:wrap;">
                  ${modPerms.map(p => `
                    <label style="display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer;">
                      <input type="checkbox" class="perm-checkbox" data-permission-id="${p.id}" ${empGrantedIds.has(p.id) ? 'checked' : ''} style="width:auto;" />
                      ${ACTION_LABELS[p.action] || p.action}
                    </label>`).join('')}
                </div>
              </div>`;
            }).join('')}
          </div>
          <div class="msg" id="permMsg"></div>
        `}
      </div>
    </div>`;

    document.getElementById('adminPanelContent').innerHTML = html;

    document.getElementById('permEmployeeSelect').addEventListener('change', (ev) => {
      selectedPermEmployeeId = ev.target.value;
      renderAdminPanel();
    });

    document.querySelectorAll('.perm-checkbox').forEach(cb => {
      cb.addEventListener('change', async (ev) => {
        const permissionId = ev.target.dataset.permissionId;
        const msg = document.getElementById('permMsg');
        ev.target.disabled = true;
        const res = await apiPermissions({
          action: ev.target.checked ? 'grant_permission' : 'revoke_permission',
          employee_id: selectedPermEmployeeId,
          permission_id: permissionId,
        });
        ev.target.disabled = false;
        if (res.success) {
          if (ev.target.checked) {
            permissionsData.grants.push({ employee_id: selectedPermEmployeeId, permission_id: permissionId });
          } else {
            permissionsData.grants = permissionsData.grants.filter(g => !(g.employee_id === selectedPermEmployeeId && g.permission_id === permissionId));
          }
          if (msg) { msg.className = 'msg success'; msg.textContent = 'Updated.'; setTimeout(() => { msg.className = 'msg'; msg.textContent = ''; }, 1500); }
        } else {
          ev.target.checked = !ev.target.checked;
          if (msg) { msg.className = 'msg error'; msg.textContent = res.error || 'Failed to update.'; }
        }
      });
    });
  }
