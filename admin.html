    .panel-body { padding: 14px; }

    /* Prevent iOS Safari from auto-zooming when tapping inputs */
    input, select, textarea { font-size: 16px !important; }

    /* Compact topbar on small screens: role text hides, name stays */
    .topbar-title { font-size: 15.5px; }
    .topbar-sub { font-size: 11px; }
    .user-chip { font-size: 12px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-chip #userRole { display: none; }

    /* Roster rows (employees/vehicles/payments) must wrap instead of overflowing off-screen */
    .roster-item {
      flex-wrap: wrap;
      gap: 8px;
    }
    .roster-item > div:first-child { flex: 1 1 100%; }
    .roster-item > div:last-child {
      flex: 1 1 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-start;
    }

    /* Vehicle-assignment control row (select + Assign button) */
    .roster-item select.assign-vehicle-select {
      max-width: 100% !important;
      flex: 1 1 auto;
    }

    /* Modals: never exceed viewport height, scroll internally if content + keyboard is tall */
    .auth-card {
      max-height: 88vh;
      overflow-y: auto;
      width: calc(100% - 20px);
      padding: 22px 18px;
    }

    /* Button groups inside table action cells must wrap on very narrow phones */
    table.ledger td.action-cell > div { flex-wrap: wrap; justify-content: flex-end; }

    /* Standalone submit buttons: full-width for easier tapping on mobile */
    #addEmpBtn, #addVehBtn, #saveSettingsBtn { width: 100%; }

    .table-scroll { max-height: none; overflow: visible; }
    table.ledger thead { display: none; }
    table.ledger, table.ledger tbody, table.ledger tr, table.ledger td { display: block; width: 100%; }
    table.ledger tr {
      border: 1px solid var(--border);
      border-radius: 7px;
      margin-bottom: 10px;
      padding: 4px 0;
      border-left-width: 1px !important;
    }
    table.ledger tr.row-pending { border-left: 3px solid var(--amber) !important; }
    table.ledger tr.row-approved { border-left: 3px solid var(--green) !important; }
    table.ledger tr.row-paid { border-left: 3px solid var(--slate) !important; }
    table.ledger td {
      border-bottom: none;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    table.ledger td::before {
      content: attr(data-label);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted);
      font-weight: 600;
      flex-shrink: 0;
    }
    table.ledger td.action-cell { justify-content: flex-end; padding-top: 10px; }
  }
</style>
</head>

<script>
  const SUPABASE_URL = "https://mamamjohuuacxezcwgqv.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_uqu742FOxl_J1VqWOsrtjw_-Ja4QfNa";

  let currentUser = null;
  let dashboardData = null;

  // Clear a field's red error highlight as soon as the user starts fixing it
  ['input', 'change', 'click'].forEach(evt => {
    document.addEventListener(evt, (e) => {
      if (e.target.classList && e.target.classList.contains('field-error-highlight')) {
        e.target.classList.remove('field-error-highlight');
      }
    }, true);
  });

  function spinnerHtml(label) {
    return `<div class="spinner-wrap"><div class="spinner"></div><div style="margin-top:12px; font-size:12.5px;">${label || 'Loading...'}</div></div>`;
  }
  function showSpinner(containerId, label) {
    const el = document.getElementById(containerId);
    if (el) el.innerHTML = spinnerHtml(label);
  }

  function setButtonLoading(btn, isLoading, loadingText, originalText) {
    if (isLoading) {
      btn.dataset.originalText = originalText !== undefined ? originalText : btn.textContent;
      btn.disabled = true;
      btn.classList.add('btn-loading');
      btn.textContent = loadingText || 'Processing';
    } else {
      btn.disabled = false;
      btn.classList.remove('btn-loading');
      btn.textContent = btn.dataset.originalText || originalText || btn.textContent;
    }
  }

  const authGate = document.getElementById('authGate');
  const appShell = document.getElementById('appShell');
  const loginMsg = document.getElementById('loginMsg');

  const pageTitles = {
    approvals: ['Approvals', 'Entries waiting for your review'],
    employees: ['Employees', 'Manage team members, roles, and rates'],
    vehicles: ['Vehicles', 'Manage company and employee-owned vehicles'],
    reports: ['Reports', 'Browse and filter all vehicle log entries'],
    payments: ['Payments', 'See what is owed and record payments made'],
    settings: ['Settings', 'Configure system-wide rules'],
  };

  async function apiLogin(mobile, pin) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ mobile_number: mobile, pin })
    });
    return res.json();
  }

  async function apiAdmin(payload) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-actions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ requester_id: currentUser.id, ...payload })
    });
    return res.json();
  }

  async function apiHR(payload) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/hr-actions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ requester_id: currentUser.id, ...payload })
    });
    return res.json();
  }

  async function apiPermissions(payload) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/permissions-actions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ requester_id: currentUser.id, ...payload })
    });
    return res.json();
  }

  async function apiVendor(payload) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/vendor-actions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ requester_id: currentUser.id, ...payload })
    });
    return res.json();
  }

  let controlPanelLoaded = false;
  let adminPanelLoaded = false;
  let vendorMasterLoaded = false;
  let documentationLoaded = false;
  let vendorDropdowns = null;
  let vendorListData = null;
  let permissionsData = null;
  let dropdownsData = null;
  let employeeListData = null;

  async function loadControlPanel() {
    controlPanelLoaded = true;
    showSpinner('hrtab-employee-master');
    showSpinner('hrtab-hr-dropdowns');
    const [dd, el] = await Promise.all([
      apiHR({ action: 'get_dropdowns' }),
      apiHR({ action: 'get_employee_list' }),
    ]);
    if (dd.success) dropdownsData = dd.dropdowns;
    if (el.success) employeeListData = el.employees;
    renderHRDropdowns();
    renderEmployeeMasterList();
  }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const mobile = document.getElementById('loginMobile').value.trim();
    const pin = document.getElementById('loginPin').value.trim();
    loginMsg.className = 'msg';
    const btn = document.getElementById('loginBtn');
    setButtonLoading(btn, true, 'Signing in');
    const data = await apiLogin(mobile, pin);
    setButtonLoading(btn, false);
    if (data.success) {
      if (!['admin', 'owner'].includes(data.employee.role)) {
        loginMsg.className = 'msg error';
        loginMsg.textContent = 'This login does not have admin access.';
        return;
      }
      currentUser = data.employee;
      sessionStorage.setItem('admin_session', JSON.stringify(currentUser));
      authGate.style.display = 'none';
      appShell.style.display = 'flex';
      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userRole').textContent = currentUser.role.toUpperCase();
      loadDashboard();
    } else {
      loginMsg.className = 'msg error';
      loginMsg.textContent = data.error || 'Login failed.';
    }
  });

  // --- Sidebar tree: expandable parents (Control Panel, Masters, HR) ---
  document.querySelectorAll('.nav-parent').forEach(btn => {
    btn.addEventListener('click', () => {
      const childrenEl = document.getElementById(btn.dataset.toggle);
      const isOpen = childrenEl.style.display !== 'none';
      childrenEl.style.display = isOpen ? 'none' : 'block';
      btn.classList.toggle('expanded', !isOpen);
    });
  });

  // --- Sidebar tree: leaf items (Km Tracker, Employee Master, HR Dropdowns, Admin Panel) ---
  const viewTitles = {
    'km-tracker': ['Km Tracker', 'Daily odometer tracking, approvals, and payments'],
    'employee-master': ['Employee Master', 'Add and manage employee records'],
    'hr-dropdowns': ['HR Dropdowns', 'Supporting master data used across HR'],
    'vendor-master': ['Vendor', 'Register and manage vendors, GST registrations, and bank accounts'],
    'admin-panel': ['Admin Panel', 'Role-based permissions and administration'],
    'documentation': ['Documentation', 'Every design decision made across this ERP, and why'],
  };

  function switchMainView(viewKey) {
    if (!viewTitles[viewKey]) viewKey = 'km-tracker';
    document.querySelectorAll('.nav-item[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === viewKey));
    document.querySelectorAll('.view-content').forEach(v => v.style.display = 'none');
    document.getElementById('view-' + viewKey).style.display = 'block';
    document.getElementById('pageTitle').textContent = viewTitles[viewKey][0];
    document.getElementById('pageSub').textContent = viewTitles[viewKey][1];
    sessionStorage.setItem('admin_active_view', viewKey);

    const isControlPanelView = ['employee-master', 'hr-dropdowns', 'admin-panel'].includes(viewKey);
    if (isControlPanelView && !controlPanelLoaded) {
      loadControlPanel();
    }
    if (viewKey === 'vendor-master' && !vendorMasterLoaded) {
      loadVendorMaster();
    }
    if (viewKey === 'admin-panel' && !adminPanelLoaded) {
      loadAdminPanel();
    }
    if (viewKey === 'documentation' && !documentationLoaded) {
      loadDocumentation();
    }

    // Every view's full ancestor tree path — including nested sub-trees like "HR" inside "Masters" —
    // must expand so the active item is actually visible in the nav, not just its top-level parent.
    const VIEW_ANCESTOR_TREES = {
      'employee-master': ['tree-control-panel', 'tree-hr'],
      'hr-dropdowns': ['tree-control-panel', 'tree-hr'],
      'vendor-master': ['tree-control-panel'],
      'admin-panel': ['tree-control-panel'],
      'documentation': ['tree-control-panel'],
    };
    (VIEW_ANCESTOR_TREES[viewKey] || []).forEach(treeId => {
      const el = document.getElementById(treeId);
      if (el) el.style.display = 'block';
      document.querySelector(`.nav-parent[data-toggle="${treeId}"]`)?.classList.add('expanded');
    });
  }

  document.querySelectorAll('.nav-item[data-view]').forEach(btn => {
    btn.addEventListener('click', () => switchMainView(btn.dataset.view));
  });

  // --- Km Tracker's own subtabs (Approvals / Reports / Payments / Settings) ---
  function switchTab(tab) {
    document.querySelectorAll('#subtabsNav .subtab-item').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    document.querySelectorAll('#view-km-tracker .tab-content').forEach(c => c.style.display = 'none');
    document.getElementById('tab-' + tab).style.display = 'block';
  }
  document.querySelectorAll('#subtabsNav .subtab-item').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  function openLightbox(url, caption) {
    document.getElementById('lightboxImg').src = url;
    document.getElementById('lightboxCaption').textContent = caption || '';
    document.getElementById('lightbox').classList.add('open');
  }
  document.getElementById('lightboxClose').addEventListener('click', () => document.getElementById('lightbox').classList.remove('open'));
  document.getElementById('lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') e.currentTarget.classList.remove('open'); });

  async function loadDashboard() {
    showSpinner('tab-approvals');
    const data = await apiAdmin({ action: 'get_dashboard' });
    if (!data.success) {
      document.getElementById('tab-approvals').innerHTML = `<div class="msg error" style="display:block">${data.error}</div>`;
      return;
    }
    dashboardData = data;
    renderApprovals();
    renderReports();
    renderPayments();
    renderSettings();
  }

  function photoCell(url, missing, label, time, location) {
    if (url) {
      return `<img src="${url}" class="photo-thumb" onclick="openLightbox('${url}', '${label} · ${time || ''} · ${(location||'').replace(/'/g,"")}')" />`;
    }
    if (missing) return `<div class="photo-missing">no photo</div>`;
    return `<div class="photo-missing">—</div>`;
  }

  let pendingRejectId = null;

  function openRejectModal(entryId) {
    pendingRejectId = entryId;
    document.getElementById('rejectReasonInput').value = '';
    document.getElementById('rejectMsg').className = 'msg';
    document.getElementById('rejectModal').classList.add('open');
  }
  document.getElementById('rejectCancelBtn').addEventListener('click', () => {
    document.getElementById('rejectModal').classList.remove('open');
    pendingRejectId = null;
  });
  document.getElementById('rejectConfirmBtn').addEventListener('click', async () => {
    const reason = document.getElementById('rejectReasonInput').value.trim();
    const msg = document.getElementById('rejectMsg');
    const btn = document.getElementById('rejectConfirmBtn');
    msg.className = 'msg';
    if (!reason) {
      msg.className = 'msg error';
      msg.textContent = 'A reason is required to reject this entry.';
      return;
    }
    setButtonLoading(btn, true, 'Rejecting');
    const res = await apiAdmin({ action: 'reject_entry', entry_id: pendingRejectId, reason });
    setButtonLoading(btn, false);
    if (res.success) {
      document.getElementById('rejectModal').classList.remove('open');
      pendingRejectId = null;
      loadDashboard();
    } else {
      msg.className = 'msg error';
      msg.textContent = res.error || 'Failed to reject entry.';
    }
  });

  function buildTable(rows, showActions) {
    let html = `<div class="table-scroll"><table class="ledger"><thead><tr>
      <th>Employee</th><th>Date</th><th>Vehicle</th><th>Morning</th><th>Evening</th><th>KM</th><th>Cost</th><th>Status</th>${showActions ? '<th>Action</th>' : ''}
    </tr></thead><tbody>`;
    rows.forEach(e => {
      const rowClass = e.status === 'calculated' ? 'row-pending' : e.status === 'approved' ? 'row-approved' : e.status === 'rejected' ? 'row-rejected' : e.status === 'paid' ? 'row-paid' : 'row-open';
      const rejectionNote = e.status === 'rejected' && e.rejection_reason ? `<div class="rejection-note">Reason: ${e.rejection_reason}</div>` : '';
      html += `<tr class="${rowClass}">
        <td data-label="Employee">${e.employees?.name || '—'}</td>
        <td data-label="Date" class="mono">${e.entry_date}</td>
        <td data-label="Vehicle">${e.vehicles?.vehicle_name || '—'}</td>
        <td data-label="Morning">
          <div style="display:flex; align-items:center; gap:8px;">
            ${photoCell(e.morning_photo_signed_url, e.morning_photo_missing, 'Morning', e.morning_timestamp ? new Date(e.morning_timestamp).toLocaleTimeString() : '', e.morning_location_text)}
            <div class="reading-cell">${e.morning_reading ?? '—'}<span class="time">${e.morning_timestamp ? new Date(e.morning_timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''}</span></div>
          </div>
        </td>
        <td data-label="Evening">
          <div style="display:flex; align-items:center; gap:8px;">
            ${photoCell(e.evening_photo_signed_url, e.evening_photo_missing, 'Evening', e.evening_timestamp ? new Date(e.evening_timestamp).toLocaleTimeString() : '', e.evening_location_text)}
            <div class="reading-cell">${e.evening_reading ?? '—'}<span class="time">${e.evening_timestamp ? new Date(e.evening_timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''}</span></div>
          </div>
        </td>
        <td data-label="KM" class="num-cell">${e.km_traveled ?? '—'}</td>
        <td data-label="Cost" class="num-cell">${e.cost !== null ? '₹' + e.cost : '—'}</td>
        <td data-label="Status"><span class="status-tag ${e.status}">${e.status.replace('_',' ')}</span>${rejectionNote}</td>
        ${showActions ? `<td class="action-cell" data-label="">
          <div style="display:flex; gap:6px;">
            <button class="btn btn-sm approve-btn" data-id="${e.id}">Approve</button>
            <button class="btn btn-sm btn-danger reject-btn" data-id="${e.id}">Reject</button>
          </div>
        </td>` : ''}
      </tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

      modal = document.createElement('div');

      document.body.appendChild(modal);
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

    modal.innerHTML = modalHtml;

  function applyReportFilters() {
    const chipsArea = document.getElementById('activeFilterChips');
    const chips = [];
    if (activeFilters.employee) {
      const emp = dashboardData.employees.find(e => e.id === activeFilters.employee);
      chips.push(`Employee: ${emp ? emp.name : '—'}`);
    }
    if (activeFilters.vehicle) {
      const veh = dashboardData.vehicles.find(v => v.id === activeFilters.vehicle);
      chips.push(`Vehicle: ${veh ? veh.vehicle_name : '—'}`);
    }
    if (activeFilters.status) chips.push(`Status: ${activeFilters.status.replace('_',' ')}`);
    if (activeFilters.from) chips.push(`From: ${activeFilters.from}`);
    if (activeFilters.to) chips.push(`To: ${activeFilters.to}`);

    chipsArea.innerHTML = chips.length === 0
      ? '<span style="color:var(--muted); font-size:12.5px;">No filters applied</span>'
      : chips.map(c => `<span class="role-tag" style="font-size:11px;">${c}</span>`).join('');

    const filtered = dashboardData.entries.filter(e => {
      if (activeFilters.employee && e.employee_id !== activeFilters.employee) return false;
      if (activeFilters.vehicle && e.vehicle_id !== activeFilters.vehicle) return false;
      if (activeFilters.status && e.status !== activeFilters.status) return false;
      if (activeFilters.from && e.entry_date < activeFilters.from) return false;
      if (activeFilters.to && e.entry_date > activeFilters.to) return false;
      return true;
    });

    document.getElementById('reportsCountLabel').textContent = `${filtered.length} Entr${filtered.length === 1 ? 'y' : 'ies'}`;
    document.getElementById('reportsTableArea').innerHTML = filtered.length === 0
      ? '<div class="empty-state">No entries match these filters.</div>'
      : buildTable(filtered, false);
  }

  function renderPayments() {
    // Group APPROVED (unpaid) entries by employee + month
    const owedGroups = {};
    dashboardData.entries.filter(e => e.status === 'approved').forEach(e => {
      const [year, month] = e.entry_date.split('-');
      const key = `${e.employee_id}_${year}_${month}`;
      if (!owedGroups[key]) {
        owedGroups[key] = { employee_id: e.employee_id, year: Number(year), month: Number(month), km: 0, cost: 0, count: 0 };
      }
      owedGroups[key].km += Number(e.km_traveled || 0);
      owedGroups[key].cost += Number(e.cost || 0);
      owedGroups[key].count += 1;
    });

    const monthNames = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    let owedRows = '';
    Object.values(owedGroups).forEach(g => {
      const emp = dashboardData.employees.find(e => e.id === g.employee_id);
      owedRows += `<div class="roster-item">
        <div>
          <div class="roster-name">${emp ? emp.name : '—'}</div>
          <div class="roster-meta">${monthNames[g.month]} ${g.year} · ${g.count} entr${g.count === 1 ? 'y' : 'ies'} · ${g.km} km</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="num-cell">₹${g.cost.toFixed(2)}</span>
          <button class="btn btn-sm mark-paid-btn" data-emp="${g.employee_id}" data-month="${g.month}" data-year="${g.year}">Mark as Paid</button>
        </div>
      </div>`;
    });

    let historyRows = '';
    (dashboardData.paymentBatches || []).forEach(b => {
      historyRows += `<div class="roster-item">
        <div>
          <div class="roster-name">${b.employees?.name || '—'}</div>
          <div class="roster-meta">${monthNames[b.period_month]} ${b.period_year} · ${b.total_km} km · Paid ${b.paid_at ? new Date(b.paid_at).toLocaleDateString() : ''}</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="num-cell">₹${Number(b.total_cost).toFixed(2)}</span>
          <button class="btn btn-sm btn-outline view-slip-btn" data-batch="${b.id}">View Slip</button>
        </div>
      </div>`;
    });

    let html = `<div class="panel">
      <div class="panel-header header-pending"><span class="panel-title">Amount Owed<span class="count-chip">${Object.keys(owedGroups).length}</span></span></div>
      <div class="panel-body">${Object.keys(owedGroups).length === 0 ? '<div class="empty-state">Nothing owed right now — all approved entries have been paid.</div>' : owedRows}</div>
    </div>
    <div class="panel">
      <div class="panel-header header-recent"><span class="panel-title">Payment History</span></div>
      <div class="panel-body">${historyRows === '' ? '<div class="empty-state">No payments recorded yet.</div>' : historyRows}</div>
    </div>`;

    document.getElementById('tab-payments').innerHTML = html;

    document.querySelectorAll('.mark-paid-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Mark this period as paid? This will generate a payment slip and cannot be undone.')) return;
        setButtonLoading(btn, true, 'Processing', 'Mark as Paid');
        const res = await apiAdmin({ action: 'mark_paid', employee_id: btn.dataset.emp, period_month: Number(btn.dataset.month), period_year: Number(btn.dataset.year) });
        if (res.success) {
          loadDashboard();
        } else {
          alert(res.error || 'Failed to mark as paid');
          setButtonLoading(btn, false, null, 'Mark as Paid');
        }
      });
    });

    document.querySelectorAll('.view-slip-btn').forEach(btn => {
      btn.addEventListener('click', () => printSlip(btn.dataset.batch));
    });
  }

  function printSlip(batchId) {
    const batch = (dashboardData.paymentBatches || []).find(b => b.id === batchId);
    if (!batch) { alert('Slip not found'); return; }
    const entries = dashboardData.entries.filter(e => e.payment_batch_id === batchId).sort((a,b) => a.entry_date.localeCompare(b.entry_date));
    const monthNames = ['','January','February','March','April','May','June','July','August','September','October','November','December'];

    let rows = entries.map(e => `<tr>
      <td style="padding:6px 10px; border:1px solid #ccc;">${e.entry_date}</td>
      <td style="padding:6px 10px; border:1px solid #ccc;">${e.vehicles?.vehicle_name || ''}</td>
      <td style="padding:6px 10px; border:1px solid #ccc; text-align:right;">${e.km_traveled}</td>
      <td style="padding:6px 10px; border:1px solid #ccc; text-align:right;">₹${e.rate_applied}</td>
      <td style="padding:6px 10px; border:1px solid #ccc; text-align:right;">₹${e.cost}</td>
    </tr>`).join('');

    const html = `<!DOCTYPE html><html><head><title>Payment Slip</title>

      <div class="panel-header"><span class="panel-title">Daily Distance Limit</span></div>

        <div class="field" style="max-width:280px"><label>Max KM allowed per day</label><input id="maxKmInput" type="number" value="${dashboardData.settings.max_daily_km}" /></div>

    document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
      const msg = document.getElementById('settingsMsg');
      const btn = document.getElementById('saveSettingsBtn');
      msg.className = 'msg';
      setButtonLoading(btn, true, 'Saving');
      const res = await apiAdmin({ action: 'update_settings', max_daily_km: document.getElementById('maxKmInput').value });
      setButtonLoading(btn, false);
      if (res.success) { msg.className = 'msg success'; msg.textContent = 'Settings updated.'; }
      else { msg.className = 'msg error'; msg.textContent = res.error || 'Failed to update settings.'; }

  // ============ HR DROPDOWNS ============
  const DROPDOWN_CONFIG = [
    { table: 'branches', label: 'Branch' },
    { table: 'departments', label: 'Department' },
    { table: 'designations', label: 'Designation' },
    { table: 'employee_categories', label: 'Employee Category' },
    { table: 'relationships', label: 'Relationship' },
    { table: 'asset_types', label: 'Asset Type' },
  ];
  let activeDropdownTab = DROPDOWN_CONFIG[0].table;

  function renderHRDropdowns() {
    if (!dropdownsData) {
      document.getElementById('hrtab-hr-dropdowns').innerHTML = '<div class="empty-state">Loading...</div>';
      return;
    }

    let tabsHtml = `<div class="subtabs" id="ddTabsNav" style="padding-left:18px;">`;
    DROPDOWN_CONFIG.forEach(cfg => {
      tabsHtml += `<button class="subtab-item ${cfg.table === activeDropdownTab ? 'active' : ''}" data-ddtab="${cfg.table}">${cfg.label}</button>`;
    });
    tabsHtml += `</div>`;

    let panelsHtml = '';
    DROPDOWN_CONFIG.forEach(cfg => {
      const items = dropdownsData[cfg.table] || [];
      panelsHtml += `<div class="ddtab-content" id="ddtab-${cfg.table}" style="${cfg.table === activeDropdownTab ? '' : 'display:none'}">
        <div class="panel">
          <div class="panel-header"><span class="panel-title">${cfg.label} Master<span class="count-chip">${items.length}</span></span></div>
          <div class="panel-body">
            <div class="form-grid" style="align-items:end; margin-bottom:14px;">
              <div class="field"><label>${cfg.label} Name</label><input type="text" class="dd-name-input" data-table="${cfg.table}" /></div>
              <div class="field"><button class="btn dd-add-btn" data-table="${cfg.table}">Add</button></div>
            </div>
            <div class="msg" id="dd-msg-${cfg.table}"></div>
            <div class="table-scroll">
              <table class="ledger"><thead><tr>
                <th>Name</th><th>Status</th><th>Action</th>
              </tr></thead><tbody>
                ${items.length === 0 ? `<tr><td colspan="3" style="text-align:center; color:var(--muted); padding:16px;">No ${cfg.label.toLowerCase()}s yet.</td></tr>` : items.map(item => `
                  <tr class="${item.is_active ? 'row-approved' : 'row-open'}">
                    <td data-label="Name">${item.name}</td>
                    <td data-label="Status"><span class="status-tag ${item.is_active ? 'approved' : 'pending_evening'}">${item.is_active ? 'Active' : 'Inactive'}</span></td>
                    <td data-label="Action" class="action-cell">
                      <div style="display:flex; gap:4px;">
                        <button class="icon-btn dd-rename-btn" data-table="${cfg.table}" data-id="${item.id}" data-name="${item.name}" title="Rename">${ACTION_ICONS.edit}</button>
                        <button class="btn btn-sm btn-outline dd-toggle-btn" data-table="${cfg.table}" data-id="${item.id}" data-active="${item.is_active}">${item.is_active ? 'Deactivate' : 'Activate'}</button>
                        <button class="icon-btn icon-btn-danger dd-delete-btn" data-table="${cfg.table}" data-id="${item.id}" title="Delete Permanently">${ACTION_ICONS.exit}</button>
                      </div>
                    </td>
                  </tr>`).join('')}
              </tbody></table>
            </div>
          </div>
        </div>
      </div>`;
    });

    document.getElementById('hrtab-hr-dropdowns').innerHTML = tabsHtml + panelsHtml;

    document.querySelectorAll('#ddTabsNav .subtab-item').forEach(btn => {
      btn.addEventListener('click', () => {
        activeDropdownTab = btn.dataset.ddtab;
        document.querySelectorAll('#ddTabsNav .subtab-item').forEach(b => b.classList.toggle('active', b === btn));
        document.querySelectorAll('.ddtab-content').forEach(c => c.style.display = 'none');
        document.getElementById('ddtab-' + btn.dataset.ddtab).style.display = 'block';
      });
    });

    document.querySelectorAll('.dd-add-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const table = btn.dataset.table;
        const nameInput = document.querySelector(`.dd-name-input[data-table="${table}"]`);
        const msg = document.getElementById(`dd-msg-${table}`);
        msg.className = 'msg';
        const fields = { name: nameInput.value.trim() };
        if (!fields.name) { msg.className = 'msg error'; msg.textContent = 'Name is required.'; return; }

        const calcType = document.querySelector(`.dd-calc-type[data-table="${table}"]`);
        const valueInput = document.querySelector(`.dd-value-input[data-table="${table}"]`);
        if (calcType) fields.calculation_type = calcType.value;
        if (valueInput) fields.value = valueInput.value;

        setButtonLoading(btn, true, 'Adding');
        const res = await apiHR({ action: 'add_dropdown_item', table, fields });
        if (res.success) {
          dropdownsData[table] = dropdownsData[table] || [];
          dropdownsData[table].push(res.item);
          renderHRDropdowns();
        } else {
          setButtonLoading(btn, false);
          msg.className = 'msg error';
          msg.textContent = res.error || 'Failed to add.';
        }
      });
    });

    document.querySelectorAll('.dd-toggle-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        setButtonLoading(btn, true, 'Updating');
        const res = await apiHR({
          action: 'toggle_dropdown_item',
          table: btn.dataset.table,
          id: btn.dataset.id,
          is_active: btn.dataset.active !== 'true',
        });
        if (res.success) {
          const idx = dropdownsData[btn.dataset.table].findIndex(i => i.id === btn.dataset.id);
          if (idx >= 0) dropdownsData[btn.dataset.table][idx] = res.item;
          renderHRDropdowns();
        } else {
          setButtonLoading(btn, false);
          alert(res.error || 'Failed to update.');
        }
      });
    });

    document.querySelectorAll('.dd-rename-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const newName = prompt('Rename to:', btn.dataset.name);
        if (!newName || !newName.trim() || newName.trim() === btn.dataset.name) return;
        const res = await apiHR({ action: 'rename_dropdown_item', table: btn.dataset.table, id: btn.dataset.id, new_name: newName.trim() });
        if (res.success) {
          const idx = dropdownsData[btn.dataset.table].findIndex(i => i.id === btn.dataset.id);
          if (idx >= 0) dropdownsData[btn.dataset.table][idx] = res.item;
          renderHRDropdowns();
        } else {
          alert(res.error || 'Failed to rename.');
        }
      });
    });

    document.querySelectorAll('.dd-delete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Permanently delete this item? This cannot be undone.')) return;
        const res = await apiHR({ action: 'delete_dropdown_item', table: btn.dataset.table, id: btn.dataset.id });
        if (res.success) {
          dropdownsData[btn.dataset.table] = dropdownsData[btn.dataset.table].filter(i => i.id !== btn.dataset.id);
          renderHRDropdowns();
        } else {
          alert(res.error || 'Failed to delete.');
        }
      });
    });
  }

  // ============ EMPLOYEE MASTER (list view) ============
  let empListStatusFilter = 'active_suspended';
  let empListSearchQuery = '';
  let empListViewMode = 'list';
  let empListGroupMode = 'flat';
  let empListPageSize = 25;
  let empListCurrentPage = 1;
  let empGroupCollapsed = {};

  function escapeRegex(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }
  function highlightMatch(text, query) {
    if (text === null || text === undefined) return '—';
    const str = String(text);
    if (!query) return str;
    const re = new RegExp('(' + escapeRegex(query) + ')', 'gi');
    return str.replace(re, '<mark style="background:#fde68a; padding:0 1px; border-radius:2px;">$1</mark>');
  }

  function empActionIcons(e) {
    return `<div style="display:flex; gap:4px;">
      ${iconBtn('emp-edit-btn', e.id, 'edit', 'Edit', '')}
      ${e.status === 'active' ? iconBtn('emp-status-btn', e.id, 'suspend', 'Suspend', 'suspended') : ''}
      ${e.status === 'suspended' ? iconBtn('emp-status-btn', e.id, 'resume', 'Resume', 'active') : ''}
      ${e.status !== 'left' ? iconBtn('emp-status-btn', e.id, 'exit', 'Mark Left', 'left') : iconBtn('emp-status-btn', e.id, 'resume', 'Reinstate', 'active')}
    </div>`;
  }

  function renderEmployeeMasterList() {
    if (!employeeListData) {
      document.getElementById('hrtab-employee-master').innerHTML = '<div class="empty-state">Loading...</div>';
      return;
    }

    const rawSearchQ = empListSearchQuery.trim();
    const searchQ = rawSearchQ.toLowerCase();
    const filtered = employeeListData.filter(e => {
      const statusMatch = empListStatusFilter === 'all' ? true
        : empListStatusFilter === 'active_suspended' ? (e.status === 'active' || e.status === 'suspended')
        : e.status === empListStatusFilter;
      if (!statusMatch) return false;
      if (!searchQ) return true;
      const haystack = [e.name, e.departments?.name, e.employee_code, e.mobile_number, e.designations?.name].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(searchQ);
    });

    // Group by department
    const groups = {};
    filtered.forEach(e => {
      const deptName = e.departments?.name || 'Unassigned';
      if (!groups[deptName]) groups[deptName] = [];
      groups[deptName].push(e);
    });
    const deptNames = Object.keys(groups).sort((a, b) => a.localeCompare(b));
    const DEPT_COLORS = ['#2563a8', '#0f766e', '#7c3aed', '#b45309', '#be123c', '#4d7c0f', '#0369a1', '#9333ea', '#b91c1c', '#15803d'];

    let groupsHtml = '';
    if (deptNames.length === 0) {
      groupsHtml = '<div class="empty-state" style="padding:16px;">No employees match this filter.</div>';
    } else if (empListGroupMode === 'flat') {
      // Flat tabular view: no department grouping, single continuous list with a Department column, paginated
      const flatEmployeesAll = [...filtered].sort((a, b) => a.name.localeCompare(b.name));
      const totalPages = Math.max(1, Math.ceil(flatEmployeesAll.length / empListPageSize));
      if (empListCurrentPage > totalPages) empListCurrentPage = totalPages;
      const pageStart = (empListCurrentPage - 1) * empListPageSize;
      const flatEmployees = flatEmployeesAll.slice(pageStart, pageStart + empListPageSize);

      let bodyHtml;
      if (empListViewMode === 'card') {
        bodyHtml = `<div class="emp-card-grid">
          ${flatEmployees.map(e => `
            <div class="emp-card">
              <div class="emp-card-top">
                <div>
                  <div class="emp-card-name"><a href="#" class="emp-view-link" data-id="${e.id}">${highlightMatch(e.name, rawSearchQ)}</a></div>
                  <div class="emp-card-code">${highlightMatch(e.employee_code, rawSearchQ)} <span class="role-tag">${e.role}</span></div>
                </div>
                <span class="status-tag ${e.status === 'active' ? 'approved' : e.status === 'suspended' ? 'calculated' : 'pending_evening'}">${e.status}</span>
              </div>
              <div class="emp-card-meta">
                <div>${highlightMatch(e.departments?.name, rawSearchQ)}</div>
                <div>${highlightMatch(e.designations?.name, rawSearchQ)}</div>
                <div>${highlightMatch(e.mobile_number, rawSearchQ)}</div>
              </div>
              ${empActionIcons(e)}
            </div>`).join('')}
        </div>`;
      } else {
        bodyHtml = `<table class="ledger emp-dept-table"><thead><tr>
          <th>Code</th><th>Name</th><th>Mobile</th><th>Department</th><th>Designation</th><th>Category</th><th>Status</th><th>Action</th>
        </tr></thead><tbody>
          ${flatEmployees.map(e => `
            <tr class="${e.status === 'active' ? 'row-approved' : e.status === 'suspended' ? 'row-pending' : 'row-open'}">
              <td data-label="Code" class="mono">${highlightMatch(e.employee_code, rawSearchQ)}</td>
              <td data-label="Name"><a href="#" class="emp-view-link" data-id="${e.id}" style="color:var(--steel); font-weight:600; text-decoration:none;">${highlightMatch(e.name, rawSearchQ)}</a><span class="role-tag">${e.role}</span></td>
              <td data-label="Mobile">${highlightMatch(e.mobile_number, rawSearchQ)}</td>
              <td data-label="Department">${highlightMatch(e.departments?.name, rawSearchQ)}</td>
              <td data-label="Designation">${highlightMatch(e.designations?.name, rawSearchQ)}</td>
              <td data-label="Category">${e.employee_categories?.name || '—'}</td>
              <td data-label="Status"><span class="status-tag ${e.status === 'active' ? 'approved' : e.status === 'suspended' ? 'calculated' : 'pending_evening'}">${e.status}</span></td>
              <td data-label="Action" class="action-cell">${empActionIcons(e)}</td>
            </tr>`).join('')}
        </tbody></table>`;
      }

      groupsHtml = bodyHtml + `<div class="emp-pagination">
        <span>Showing ${flatEmployeesAll.length === 0 ? 0 : pageStart + 1}–${Math.min(pageStart + empListPageSize, flatEmployeesAll.length)} of ${flatEmployeesAll.length}</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <button type="button" class="btn btn-sm btn-outline" id="empPagePrevBtn" ${empListCurrentPage <= 1 ? 'disabled' : ''}>‹ Prev</button>
          <span style="font-size:12.5px; color:var(--muted);">Page ${empListCurrentPage} of ${totalPages}</span>
          <button type="button" class="btn btn-sm btn-outline" id="empPageNextBtn" ${empListCurrentPage >= totalPages ? 'disabled' : ''}>Next ›</button>
        </div>
      </div>`;
    } else {
      deptNames.forEach((deptName, deptIdx) => {
        const groupEmployees = groups[deptName];
        const isCollapsed = !!empGroupCollapsed[deptName];
        const deptColor = DEPT_COLORS[deptIdx % DEPT_COLORS.length];

        let groupBodyHtml;
        if (empListViewMode === 'card') {
          groupBodyHtml = `<div class="emp-card-grid">
            ${groupEmployees.map(e => `
              <div class="emp-card">
                <div class="emp-card-top">
                  <div>
                    <div class="emp-card-name"><a href="#" class="emp-view-link" data-id="${e.id}">${highlightMatch(e.name, rawSearchQ)}</a></div>
                    <div class="emp-card-code">${highlightMatch(e.employee_code, rawSearchQ)} <span class="role-tag">${e.role}</span></div>
                  </div>
                  <span class="status-tag ${e.status === 'active' ? 'approved' : e.status === 'suspended' ? 'calculated' : 'pending_evening'}">${e.status}</span>
                </div>
                <div class="emp-card-meta">
                  <div>${highlightMatch(e.designations?.name, rawSearchQ)}</div>
                  <div>${e.employee_categories?.name || '—'}</div>
                  <div>${highlightMatch(e.mobile_number, rawSearchQ)}</div>
                </div>
                ${empActionIcons(e)}
              </div>`).join('')}
          </div>`;
        } else {
          groupBodyHtml = `<table class="ledger emp-dept-table"><thead><tr>
            <th>Code</th><th>Name</th><th>Mobile</th><th>Designation</th><th>Category</th><th>Status</th><th>Action</th>
          </tr></thead><tbody>
            ${groupEmployees.map(e => `
              <tr class="${e.status === 'active' ? 'row-approved' : e.status === 'suspended' ? 'row-pending' : 'row-open'}">
                <td data-label="Code" class="mono">${highlightMatch(e.employee_code, rawSearchQ)}</td>
                <td data-label="Name"><a href="#" class="emp-view-link" data-id="${e.id}" style="color:var(--steel); font-weight:600; text-decoration:none;">${highlightMatch(e.name, rawSearchQ)}</a><span class="role-tag">${e.role}</span></td>
                <td data-label="Mobile">${highlightMatch(e.mobile_number, rawSearchQ)}</td>
                <td data-label="Designation">${highlightMatch(e.designations?.name, rawSearchQ)}</td>
                <td data-label="Category">${e.employee_categories?.name || '—'}</td>
                <td data-label="Status"><span class="status-tag ${e.status === 'active' ? 'approved' : e.status === 'suspended' ? 'calculated' : 'pending_evening'}">${e.status}</span></td>
                <td data-label="Action" class="action-cell">${empActionIcons(e)}</td>
              </tr>`).join('')}
          </tbody></table>`;
        }

        groupsHtml += `<div class="emp-dept-group">
          <button type="button" class="emp-dept-header" data-dept="${deptName}" style="border-bottom-color:${deptColor};">
            <span class="emp-dept-name" style="color:${deptColor};">${highlightMatch(deptName, rawSearchQ)}</span>
            <span class="count-chip">${groupEmployees.length}</span>
            <span style="margin-left:auto; font-size:11px; font-weight:500; color:var(--muted);">${isCollapsed ? 'Show' : 'Hide'}</span>
          </button>
          <div class="emp-dept-body" style="${isCollapsed ? 'display:none' : ''}">
            ${empListViewMode === 'card' ? groupBodyHtml : `<div class="table-scroll">${groupBodyHtml}</div>`}
          </div>
        </div>`;
      });
    }

    let html = `<div class="panel panel-no-clip">
      <div class="panel-header emp-list-sticky-header" style="flex-wrap:wrap; gap:10px;">

          <select id="empListStatusFilterSelect" style="padding:7px 10px; font-size:12.5px; border:1px solid var(--border); border-radius:6px; background:var(--surface-sunken);">
            <option value="active_suspended" ${empListStatusFilter === 'active_suspended' ? 'selected' : ''}>Active &amp; Suspended</option>
            <option value="all" ${empListStatusFilter === 'all' ? 'selected' : ''}>All Employees</option>
            <option value="active" ${empListStatusFilter === 'active' ? 'selected' : ''}>Active</option>
            <option value="suspended" ${empListStatusFilter === 'suspended' ? 'selected' : ''}>Suspended</option>
            <option value="left" ${empListStatusFilter === 'left' ? 'selected' : ''}>Left</option>
          </select>
          ${empListGroupMode === 'flat' ? `
          <select id="empPageSizeSelect" style="padding:7px 10px; font-size:12.5px; border:1px solid var(--border); border-radius:6px; background:var(--surface-sunken);">
            <option value="10" ${empListPageSize === 10 ? 'selected' : ''}>10 / Page</option>
            <option value="25" ${empListPageSize === 25 ? 'selected' : ''}>25 / Page</option>
            <option value="50" ${empListPageSize === 50 ? 'selected' : ''}>50 / Page</option>
          </select>` : ''}
          <div class="view-toggle">

            </button>
            <button type="button" class="view-toggle-btn ${empListGroupMode === 'flat' ? 'active' : ''}" id="empFlatModeBtn" title="Simple Table (no grouping)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/><path d="M3 6v12M21 6v12"/></svg>
            </button>
          </div>
          <div class="view-toggle">
            <button type="button" class="view-toggle-btn ${empListViewMode === 'list' ? 'active' : ''}" id="empListViewBtn" title="List View">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            </button>
            <button type="button" class="view-toggle-btn ${empListViewMode === 'card' ? 'active' : ''}" id="empCardViewBtn" title="Card View">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </button>
          </div>
          <button class="btn btn-sm" id="newEmployeeBtn" title="Add New Employee" style="height:32px; padding:0 12px; font-size:12.5px; font-weight:650; display:flex; align-items:center;">+ Add</button>
        </div>
      </div>
      <div class="panel-body" style="padding:12px 18px;">
        ${groupsHtml}
      </div>
    </div>`;

    document.getElementById('hrtab-employee-master').innerHTML = html;

    // Position the table's column headers to stick directly below the sticky toolbar row
    const stickyHeader = document.querySelector('.emp-list-sticky-header');
    if (stickyHeader) {
      const headerHeight = stickyHeader.offsetHeight;
      document.querySelectorAll('.emp-dept-table thead th').forEach(th => {
        th.style.top = headerHeight + 'px';
      });

    document.getElementById('empListSearchInput').addEventListener('input', (ev) => {
      empListSearchQuery = ev.target.value;
      empListCurrentPage = 1;
      renderEmployeeMasterList();
      const newInput = document.getElementById('empListSearchInput');
      newInput.focus();
      newInput.setSelectionRange(newInput.value.length, newInput.value.length);
    });
    document.getElementById('empListStatusFilterSelect').addEventListener('change', (ev) => {
      empListStatusFilter = ev.target.value;
      empListCurrentPage = 1;
      renderEmployeeMasterList();
    });
    document.getElementById('empGroupedModeBtn').addEventListener('click', () => { empListGroupMode = 'grouped'; renderEmployeeMasterList(); });
    document.getElementById('empFlatModeBtn').addEventListener('click', () => { empListGroupMode = 'flat'; empListCurrentPage = 1; renderEmployeeMasterList(); });
    document.getElementById('empPageSizeSelect')?.addEventListener('change', (ev) => {
      empListPageSize = Number(ev.target.value);
      empListCurrentPage = 1;
      renderEmployeeMasterList();
    });
    document.getElementById('empPagePrevBtn')?.addEventListener('click', () => {
      empListCurrentPage = Math.max(1, empListCurrentPage - 1);
      renderEmployeeMasterList();
    });
    document.getElementById('empPageNextBtn')?.addEventListener('click', () => {
      empListCurrentPage += 1;
      renderEmployeeMasterList();
    });
    document.getElementById('empListViewBtn').addEventListener('click', () => { empListViewMode = 'list'; renderEmployeeMasterList(); });
    document.getElementById('empCardViewBtn').addEventListener('click', () => { empListViewMode = 'card'; renderEmployeeMasterList(); });
    document.querySelectorAll('.emp-dept-header').forEach(btn => {
      btn.addEventListener('click', () => {
        const dept = btn.dataset.dept;
        empGroupCollapsed[dept] = !empGroupCollapsed[dept];
        renderEmployeeMasterList();
      });
    });
    document.getElementById('newEmployeeBtn').addEventListener('click', () => openEmployeeForm(null));
    document.querySelectorAll('.emp-view-link').forEach(link => {
      link.addEventListener('click', (ev) => { ev.preventDefault(); openEmployeeView(link.dataset.id); });
    });
    document.querySelectorAll('.emp-edit-btn').forEach(btn => {
      btn.addEventListener('click', () => openEmployeeForm(btn.dataset.id));
    });
    document.querySelectorAll('.emp-status-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const statusLabel = { active: 'reactivate', suspended: 'suspend', left: 'mark as left (their login will be blocked)' }[btn.dataset.status];
        if (!confirm(`Are you sure you want to ${statusLabel} this employee?`)) return;
        setButtonLoading(btn, true, '');
        const res = await apiHR({ action: 'update_employee_status', employee_id: btn.dataset.id, new_status: btn.dataset.status });
        if (res.success) {
          const idx = employeeListData.findIndex(e => e.id === btn.dataset.id);
          if (idx >= 0) employeeListData[idx].status = res.employee.status;
          renderEmployeeMasterList();
        } else {
          setButtonLoading(btn, false);
          alert(res.error || 'Failed to update status.');
        }
      });
    });
  }

  function renderViewRepeatable(rows, fieldPairs) {
    if (!rows || rows.length === 0) return '<div class="empty-state">None recorded.</div>';
    return rows.map(row => `
      <div class="form-grid" style="border:1px solid var(--border); border-radius:6px; padding:12px; margin-bottom:10px;">
        ${fieldPairs.map(([key, label]) => {
          const val = key.includes('.') ? row[key.split('.')[0]]?.[key.split('.')[1]] : row[key];
          return viewField(label, val);
        }).join('')}
      </div>`).join('');
  }

  async function quickStatusChange(employeeId, newStatus, label) {
    if (!confirm(`Are you sure you want to ${label} this employee?`)) return;
    const res = await apiHR({ action: 'update_employee_status', employee_id: employeeId, new_status: newStatus });
    if (res.success) {
      const idx = employeeListData.findIndex(x => x.id === employeeId);
      if (idx >= 0) employeeListData[idx].status = res.employee.status;
      openEmployeeView(employeeId);
    } else {
      alert(res.error || 'Failed to update status.');
    }
  }

    document.getElementById('hrtab-employee-master').innerHTML = '<div class="panel"><div class="panel-body empty-state">Loading form...</div></div>';

    let detail = null;
    if (employeeId) {
      const res = await apiHR({ action: 'get_employee_detail', employee_id: employeeId });

    renderEmployeeForm(employeeId, detail);

  // Reusable inline "upload next to this field" widget — used for Aadhar/License/PF/ESI docs
  // Reusable "dropdown with checkboxes" multi-select
  function multiSelectDropdown(id, label, options, selected) {
    selected = selected || [];
    return `<div class="field msdd-field">
      <label>${label}</label>
      <div class="msdd-trigger" id="${id}-trigger" tabindex="0">
        <span id="${id}-display">${selected.length ? selected.join(', ') : 'Select...'}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="msdd-panel" id="${id}-panel" style="display:none;">
        ${options.map(o => `<label class="msdd-option"><input type="checkbox" class="msdd-checkbox" data-value="${o}" ${selected.includes(o) ? 'checked' : ''} />${o}</label>`).join('')}
      </div>
    </div>`;
  }
  function wireMultiSelectDropdown(id) {
    const trigger = document.getElementById(`${id}-trigger`);
    const panel = document.getElementById(`${id}-panel`);
    const display = document.getElementById(`${id}-display`);
    if (!trigger || !panel) return;
    trigger.addEventListener('click', (ev) => {
      ev.stopPropagation();
      document.querySelectorAll('.msdd-panel').forEach(p => { if (p !== panel) p.style.display = 'none'; });
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });
    document.addEventListener('click', (ev) => {
      if (panel.style.display !== 'none' && !panel.contains(ev.target) && ev.target !== trigger) panel.style.display = 'none';
    });
    panel.querySelectorAll('.msdd-checkbox').forEach(cb => {
      cb.addEventListener('change', () => {
        const selected = [...panel.querySelectorAll('.msdd-checkbox:checked')].map(c => c.dataset.value);
        display.textContent = selected.length ? selected.join(', ') : 'Select...';
      });
    });
  }
  function getMultiSelectValues(id) {
    return [...document.querySelectorAll(`#${id}-panel .msdd-checkbox:checked`)].map(c => c.dataset.value);
  }

        <button type="button" class="btn btn-sm doc-dropzone-btn" id="uploadBtn_${slot}">${existingDoc ? 'Replace File' : 'Choose File'}</button>

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Files selected are held here until the employee is saved (create or update),
  // since a brand-new employee doesn't have an ID yet to attach files to.
  let pendingUploads = {};

  function wireDocUploadTrigger(slot, options = {}) {
    const btn = document.getElementById(`uploadBtn_${slot}`);
    const input = document.getElementById(`upload_${slot}`);
    if (!btn || !input) return;
    btn.addEventListener('click', () => input.click());
    input.addEventListener('change', async (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      const base64 = await fileToBase64(file);
      const ext = file.name.split('.').pop().toLowerCase();
      pendingUploads[slot] = { base64, ext, document_name: options.documentName || slot };
      if (options.isPhoto) {
        document.getElementById('photoStatusInput').value = `Selected: ${file.name} (will save with the form)`;
        document.getElementById('photoPreviewBox').innerHTML = `<img src="${base64}" style="width:38px; height:38px; object-fit:cover; border-radius:6px; border:1px solid var(--border);" />`;
      } else {
        const status = document.getElementById(`uploadStatus_${slot}`);
        if (status) status.textContent = `Selected: ${file.name} (will save with the form)`;
      }
    });
  }

  function setupDocumentUploadTriggers(documents) {
    pendingUploads = {};
    wireDocUploadTrigger('photo', { isPhoto: true });
    wireDocUploadTrigger('aadhar');
    wireDocUploadTrigger('driving_license');
    wireDocUploadTrigger('pf_certificate');
    wireDocUploadTrigger('esi_certificate');
  }

  // Inline single-row "Add" form + ledger table with Edit/Delete, matching HR Dropdowns pattern
  function setupRepeatableSection(containerId, initialRows, fields, addLabel) {
    const container = document.getElementById(containerId);
    let rows = initialRows.length > 0 ? [...initialRows] : [];
    let editingIndex = null;
    let formOpen = false;

    function fieldInputHtml(f, val) {
      if (f.type === 'select') {
        return `<select data-key="${f.key}" style="min-width:140px;">${opt(f.options, val)}</select>`;
      }
      if (f.type === 'checkbox') {
        return `<label style="display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--muted); white-space:nowrap; padding-bottom:10px;"><input type="checkbox" data-key="${f.key}" ${val ? 'checked' : ''} style="width:auto;" />${f.label}</label>`;
      }
      return `<input type="${f.type || 'text'}" data-key="${f.key}" value="${val ?? ''}" placeholder="${f.label}" style="min-width:130px;" />`;
    }

    function displayVal(f, row) {
      if (f.type === 'select') return (f.options || []).find(o => o.id === row[f.key])?.name || '—';
      if (f.type === 'checkbox') return row[f.key] ? 'Yes' : 'No';
      return row[f.key] || '—';
    }

    function render() {
      const editingRow = editingIndex !== null ? rows[editingIndex] : {};
      const showForm = formOpen || editingIndex !== null;

      const formRowHtml = showForm ? `
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:end; padding:14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; margin-bottom:12px;">
          ${fields.map(f => {
            const val = f.type === 'checkbox' ? editingRow[f.key] : (editingRow[f.key] ?? '');
            const label = (f.required ? f.label + ' *' : f.label);
            return `<div class="field" style="margin-bottom:0;">${f.type !== 'checkbox' ? `<label>${label}</label>` : ''}${fieldInputHtml(f, val)}</div>`;
          }).join('')}
          <button type="button" class="btn btn-sm" id="${containerId}-addBtn">${editingIndex !== null ? 'Update' : 'Add'}</button>
          <button type="button" class="btn btn-sm btn-outline" id="${containerId}-cancelEditBtn">Cancel</button>
        </div>` : `
        <button type="button" class="btn btn-sm btn-outline" id="${containerId}-openBtn" style="margin-bottom:12px;">+ ${addLabel || 'Add'}</button>`;

      const tableHtml = `
        <div class="table-scroll">
          <table class="ledger"><thead><tr>
            ${fields.map(f => `<th>${f.label}</th>`).join('')}<th>Action</th>
          </tr></thead><tbody>
            ${rows.length === 0 ? `<tr><td colspan="${fields.length + 1}" style="text-align:center; color:var(--muted); padding:16px;">None added yet.</td></tr>` : rows.map((row, idx) => `
              <tr>
                ${fields.map(f => `<td data-label="${f.label}">${displayVal(f, row)}</td>`).join('')}
                <td data-label="Action" class="action-cell">
                  <div style="display:flex; gap:4px;">
                    <button type="button" class="icon-btn ${containerId}-editBtn" data-idx="${idx}" title="Edit">${ACTION_ICONS.edit}</button>
                    <button type="button" class="icon-btn icon-btn-danger ${containerId}-deleteBtn" data-idx="${idx}" title="Delete">${ACTION_ICONS.exit}</button>
                  </div>
                </td>
              </tr>`).join('')}
          </tbody></table>
        </div>`;

      container.innerHTML = formRowHtml + tableHtml;

      document.getElementById(`${containerId}-openBtn`)?.addEventListener('click', () => {
        formOpen = true;
        render();
      });

      document.getElementById(`${containerId}-addBtn`)?.addEventListener('click', () => {
        const newRow = {};
        fields.forEach(f => {
          const input = container.querySelector(`[data-key="${f.key}"]`);
          if (!input) return;
          newRow[f.key] = f.type === 'checkbox' ? input.checked : input.value.trim();
        });

        // Block entirely blank rows
        const anyFilled = fields.some(f => {
          const v = newRow[f.key];
          return f.type === 'checkbox' ? false : !!v;
        });
        if (!anyFilled) {
          alert('Please fill in at least the required fields before adding.');
          return;
        }
        // Block if a required field is missing
        const missingRequired = fields.find(f => f.required && !newRow[f.key]);
        if (missingRequired) {
          alert(`"${missingRequired.label}" is required.`);
          return;
        }

        if (editingIndex !== null) {
          rows[editingIndex] = newRow;
          editingIndex = null;
        } else {
          rows.push(newRow);
        }
        formOpen = false;
        render();
      });

      document.getElementById(`${containerId}-cancelEditBtn`)?.addEventListener('click', () => {
        editingIndex = null;
        formOpen = false;
        render();
      });

      container.querySelectorAll(`.${containerId}-editBtn`).forEach(btn => {
        btn.addEventListener('click', () => {
          editingIndex = Number(btn.dataset.idx);
          render();
        });
      });
      container.querySelectorAll(`.${containerId}-deleteBtn`).forEach(btn => {
        btn.addEventListener('click', () => {
          if (!confirm('Remove this entry?')) return;
          rows.splice(Number(btn.dataset.idx), 1);
          if (editingIndex === Number(btn.dataset.idx)) editingIndex = null;
          render();
        });
      });
    }

    container.getRows = () => rows;
    render();
  }

      present_state_id: val('f_present_state_id') || null,
      present_pincode: val('f_present_pincode'),
      permanent_address: val('f_permanent_address'),
      permanent_city_id: val('f_permanent_city_id') || null,
      permanent_state_id: val('f_permanent_state_id') || null,
      permanent_pincode: val('f_permanent_pincode'),
      tel_home: val('f_tel_home'),
      driving_license_number: hasDrivingLicense ? val('f_driving_license_number') : null,
      driving_license_category: hasDrivingLicense ? val('f_driving_license_category') : null,

      emergency_contact_name: val('f_emergency_contact_name'),
      emergency_contact_relation: val('f_emergency_contact_relation'),
      emergency_contact_mobile: val('f_emergency_contact_mobile'),
      emergency_contact_address: val('f_emergency_contact_address'),
      salary_payment_method: paymentMethod,
      bank_name: val('f_bank_name'),
      bank_account_number: val('f_bank_account_number'),
      bank_ifsc: val('f_bank_ifsc'),
      bank_branch: val('f_bank_branch'),
      bank_account_holder_name: val('f_bank_account_holder_name'),
      pan_number: val('f_pan_number'),
      uan_number: val('f_uan_number'),
      salary_basic: val('f_salary_basic'),
      salary_hra: val('f_salary_hra'),
      salary_da: val('f_salary_da'),
      salary_ta: val('f_salary_ta'),
      salary_esi: val('f_salary_esi') === 'true',
      pf_applicable: pfApplicable,

      ref_employee_name: val('f_ref_employee_name'),
      ref_employee_contact: val('f_ref_employee_contact'),
    };

    // ---------- Mandatory field validation ----------
    const errors = [];
    const err = (label, targetId) => errors.push({ label, targetId });
    if (!core.employee_code) err('Employee Code', 'f_employee_code');
    if (!core.name) err('Full Name', 'f_name');
    if (!core.mobile_number) err('Mobile Number', 'f_mobile_number');
    if (!core.branch_id) err('Branch', 'f_branch_id');
    if (!core.department_id) err('Department', 'f_department_id');
    if (!core.designation_id) err('Designation', 'f_designation_id');
    if (!core.employee_category_id) err('Employee Category', 'f_employee_category_id');
    if (!core.date_of_joining) err('Date of Joining', 'f_date_of_joining');
    if (!core.wage_type) err('Wage Type', 'f_wage_type');
    if (vehicleApplicable) {
      if (!core.vehicle_number) err('Vehicle Number', 'f_vehicle_number');
      if (!core.rate_per_km) err('Rate per KM', 'f_rate_per_km');
      if (!core.driving_license_number) err('Driving License No (required since Vehicle KM is applicable)', 'f_driving_license_number');
      if (!hasDoc('driving_license')) err('Driving License Upload (required since Vehicle KM is applicable)', 'uploadBtn_driving_license');
    }
    if (!core.father_husband_name) err('Father/Husband Name', 'f_father_husband_name');
    if (!core.marital_status) err('Marital Status', 'f_marital_status');
    if (!core.gender) err('Gender', 'f_gender');
    if (!core.date_of_birth) err('Date of Birth', 'f_date_of_birth');
    if (!core.aadhar_no) err('Aadhar No', 'f_aadhar_no');
    if (!hasDoc('aadhar')) err('Aadhar Card Upload', 'uploadBtn_aadhar');
    if (!core.present_address) err('Present Address', 'f_present_address');
    if (!core.present_state_id) err('Present State', 'f_present_state_id');
    if (!core.present_city_id) err('Present City', 'f_present_city_id');
    if (!checked('f_same_as_present')) {
      if (!core.permanent_address) err('Permanent Address', 'f_permanent_address');
      if (!core.permanent_state_id) err('Permanent State', 'f_permanent_state_id');
      if (!core.permanent_city_id) err('Permanent City', 'f_permanent_city_id');
    }
    if (core.driving_license_number && !core.driving_license_validity) err('License Validity (since License No is filled)', 'f_driving_license_validity');
    if (!core.emergency_contact_name) err('Emergency Contact Name', 'f_emergency_contact_name');
    if (!core.emergency_contact_relation) err('Emergency Contact Relation', 'f_emergency_contact_relation');
    if (!core.emergency_contact_mobile) err('Emergency Contact Mobile', 'f_emergency_contact_mobile');
    if (paymentMethod === 'bank') {
      if (!core.bank_name) err('Bank Name (Payment Method = Bank)', 'f_bank_name');
      if (!core.bank_account_number) err('Account Number (Payment Method = Bank)', 'f_bank_account_number');
      if (!core.bank_ifsc) err('IFSC Code (Payment Method = Bank)', 'f_bank_ifsc');
    }
    if (pfApplicable) {
      if (!core.pf_number) err('PF Number', 'f_pf_number');
      if (!core.uan_number) err('UAN Number', 'f_uan_number');
      if (!hasDoc('pf_certificate')) err('PF Certificate Upload', 'uploadBtn_pf_certificate');
    }
    if (esiApplicable) {
      if (!core.esi_number) err('ESI Number', 'f_esi_number');
      if (!hasDoc('esi_certificate')) err('ESI Certificate Upload', 'uploadBtn_esi_certificate');
    }
    if (!core.salary_basic) err('Salary Basic', 'f_salary_basic');
    if (!hasDoc('photo')) err('Photo Upload', 'uploadBtn_photo');
    if (checked('f_has_ref_employee') && !core.ref_employee_name) err('REF Employee Reference (since "Has reference of a REF employee" is checked)', 'f_ref_employee_name');
    const educationRows = document.getElementById('educationRows').getRows();
    if (educationRows.length === 0) err('At least one Education / Qualification entry', 'educationRows');
    const familyRows = document.getElementById('familyRows').getRows();
    familyRows.forEach((r, i) => { if (!r.member_name) err(`Family row ${i + 1}: Name`, 'familyRows'); });
    const workRows = document.getElementById('workRows').getRows();
    workRows.forEach((r, i) => { if (!r.company_name) err(`Work Experience row ${i + 1}: Company Name`, 'workRows'); });

    // Clear any previous error highlighting
    document.querySelectorAll('.field-error-highlight').forEach(el => el.classList.remove('field-error-highlight'));

    if (errors.length > 0) {
      // Highlight every field that has an error
      errors.forEach(e => {
        const el = document.getElementById(e.targetId);
        if (el) el.classList.add('field-error-highlight');
      });

      msg.className = 'msg error';
      msg.innerHTML = 'Please complete the following before saving:<br>• ' + errors.map(e => e.label).join('<br>• ');

      // Jump to and focus the first error field
      const firstEl = document.getElementById(errors[0].targetId);
      if (firstEl) {
        firstEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => firstEl.focus?.(), 350);
      }
      return;
    }

    setButtonLoading(btn, true, 'Saving');

    let empResult;
    if (employeeId) {
      empResult = await apiHR({ action: 'update_employee', employee_id: employeeId, core });
    } else {
      empResult = await apiHR({ action: 'create_employee', core, pin: null });
    }

    if (!empResult.success) {
      msg.className = 'msg error';
      msg.textContent = empResult.error || 'Failed to save employee.';
      setButtonLoading(btn, false);
      return;
    }

    const finalEmployeeId = empResult.employee.id;

    // Save all child record sections
    const childSaves = [
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_family_members', records: familyRows }),
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_education', records: educationRows }),
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_work_experience', records: workRows }),
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_nominees', records: document.getElementById('nomineeRows').getRows() }),
    ];

    // Upload any pending documents now that we have a real employee_id
    const uploadSaves = Object.entries(pendingUploads).map(([slot, data]) =>
      apiHR({ action: 'upload_document', employee_id: finalEmployeeId, slot, file_base64: data.base64, file_ext: data.ext, document_name: data.document_name })
    );

    await Promise.all([...childSaves, ...uploadSaves]);
    pendingUploads = {};

    msg.className = 'msg success';
    msg.textContent = empResult.generatedPin
      ? `Employee saved successfully. Their login PIN is: ${empResult.generatedPin} (last 4 digits of mobile number). Share this with them.`
      : 'Employee saved successfully.';
    const listRes = await apiHR({ action: 'get_employee_list' });
    if (listRes.success) employeeListData = listRes.employees;
    setTimeout(() => renderEmployeeMasterList(), empResult.generatedPin ? 3500 : 800);
  }

  function initials(name) {
    return (name || '?').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  }
  function avatarColor(name) {
    let hash = 0;
    for (let i = 0; i < (name || '').length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
  }
