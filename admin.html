  function renderAdminPanel() {
    if (!permissionsData) return;
    const { permissions, employees, grants } = permissionsData;

    if (!selectedPermEmployeeId && employees.length > 0) {
      const first = employees.find(e => e.role !== 'owner') || employees[0];
      selectPermEmployee(first.id);
      return; // selectPermEmployee re-calls renderAdminPanel
    }

    const deptNames = [...new Set(employees.map(e => e.departments?.name).filter(Boolean))].sort();

    const filteredEmployees = employees.filter(e => {
      if (permStatusFilter !== 'all' && e.status !== permStatusFilter) return false;
      if (permDeptFilter !== 'all' && e.departments?.name !== permDeptFilter) return false;
      if (permSearchQuery) {
        const hay = [e.name, e.employee_code, e.designations?.name].filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(permSearchQuery.toLowerCase())) return false;
      }
      return true;
    });

    const selectedEmp = employees.find(e => e.id === selectedPermEmployeeId);
    const categories = [...new Set(permissions.map(p => p.category))];

    const empHasAccess = (empId) => grants.some(g => g.employee_id === empId);

    let html = `<div class="panel panel-no-clip">
      <div class="panel-header"><span class="panel-title">Roles &amp; Permissions</span></div>
      <div style="display:flex; min-height:600px;">

        <!-- LEFT: employee list -->
        <div style="width:300px; height:600px; flex-shrink:0; display:flex; flex-direction:column; border-right:1px solid var(--border);">
          <div style="padding:14px; border-bottom:1px solid var(--border);">
            <input type="text" id="permSearchInput" placeholder="Search name, email, designation..." value="${permSearchQuery}" style="width:100%; margin-bottom:8px; padding:9px 12px; border-radius:8px; border:1px solid var(--border); background:#fff;" />
            <div style="display:flex; gap:8px;">
              <select id="permDeptFilterSelect" style="flex:1; font-size:13px; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:#fff;">
                <option value="all">All Departments</option>
                ${deptNames.map(d => `<option value="${d}" ${permDeptFilter === d ? 'selected' : ''}>${d}</option>`).join('')}
              </select>
              <select id="permStatusFilterSelect" style="flex:1; font-size:13px; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:#fff;">
                <option value="all" ${permStatusFilter === 'all' ? 'selected' : ''}>All Status</option>
                <option value="active" ${permStatusFilter === 'active' ? 'selected' : ''}>Active</option>
                <option value="suspended" ${permStatusFilter === 'suspended' ? 'selected' : ''}>Suspended</option>
                <option value="left" ${permStatusFilter === 'left' ? 'selected' : ''}>Left</option>
              </select>
            </div>
          </div>
          <div style="flex:1; overflow-y:auto;">
            ${filteredEmployees.length === 0 ? '<div class="empty-state" style="padding:16px;">No matches.</div>' : filteredEmployees.map(e => `
              <button type="button" class="perm-emp-row ${e.id === selectedPermEmployeeId ? 'active' : ''}" data-id="${e.id}" style="width:100%; display:flex; align-items:center; gap:10px; padding:10px 14px; border:none; border-bottom:1px solid var(--border); background:${e.id === selectedPermEmployeeId ? 'var(--steel-dark)' : '#fff'}; color:${e.id === selectedPermEmployeeId ? '#fff' : 'var(--ink)'}; cursor:pointer; text-align:left;">
                <div style="width:32px; height:32px; border-radius:50%; background:${avatarColor(e.name)}; color:#fff; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; flex-shrink:0;">${initials(e.name)}</div>
                <div style="flex:1; min-width:0;">
                  <div style="font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${e.name}</div>
                  <div style="font-size:11px; opacity:0.7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${e.designations?.name || '—'} · ${e.departments?.name || '—'}</div>
                </div>
                <span style="font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:4px; white-space:nowrap; background:${empHasAccess(e.id) ? (e.id === selectedPermEmployeeId ? 'rgba(255,255,255,0.2)' : 'var(--green-bg)') : (e.id === selectedPermEmployeeId ? 'rgba(255,255,255,0.1)' : 'var(--surface-sunken)')}; color:${empHasAccess(e.id) ? (e.id === selectedPermEmployeeId ? '#fff' : 'var(--green)') : (e.id === selectedPermEmployeeId ? 'rgba(255,255,255,0.6)' : 'var(--muted)')};">${empHasAccess(e.id) || e.role === 'owner' ? 'HAS ACCESS' : 'NO ACCESS'}</span>
              </button>`).join('')}
          </div>
        </div>

        <!-- RIGHT: selected employee's permission grid -->
        <div id="permDetailScrollArea" style="flex:1; padding:0 20px; min-width:0; height:600px; overflow-y:auto; overflow-x:hidden;">
          ${!selectedEmp ? '<div class="empty-state">Select an employee.</div>' : `
            <div id="permDetailStickyHeader" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; padding:16px 0; background:#fff; position:sticky; top:0; z-index:20;">
              <div>
                <div style="font-size:16px; font-weight:700;">${selectedEmp.name}</div>
                <div style="font-size:12.5px; color:var(--muted); margin-top:2px;">${selectedEmp.designations?.name || '—'} · ${selectedEmp.departments?.name || '—'} · ${selectedEmp.mobile_number || ''}</div>
              </div>
              ${selectedEmp.role !== 'owner' ? `
              <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                <button class="btn btn-sm btn-outline" id="permGrantAllBtn">Grant All</button>
                <button class="btn btn-sm btn-outline" id="permRevokeAllBtn" style="color:var(--danger); border-color:#efd2cf;">Revoke All</button>
                <button class="btn btn-sm" id="permSaveBtn" ${permDirty ? '' : 'disabled'}>Save</button>
              </div>` : ''}
            </div>

            ${selectedEmp.role === 'owner' ? `
              <div class="empty-state">
                <strong>${selectedEmp.name}</strong> is the Owner — automatic full access to everything, cannot be restricted. No permissions to manage here.
              </div>
            ` : `
              <table class="ledger perm-grid-table">
                  <thead><tr>
                    <th style="text-align:left;">Module / Sub-head</th>
                    ${ACTION_ORDER.map(a => `<th class="perm-col-header" data-action="${a}" style="text-align:center; cursor:pointer;" title="Click to toggle all in this column">${ACTION_LABELS[a]}<br/><span style="font-size:10px; font-weight:500; color:var(--muted); text-transform:none;">all</span></th>`).join('')}
                  </tr></thead>
                  <tbody>
                    ${categories.map(cat => {
                      const catPerms = permissions.filter(p => p.category === cat);
                      const subHeads = [...new Set(catPerms.map(p => p.sub_head))];
                      const catPermIds = catPerms.map(p => p.id);

                      // Category header row: its own select-all checkboxes per action, toggling every sub-head under it at once
                      let rowsHtml = `<tr class="perm-category-row" data-category="${cat}">
                        <td style="font-weight:700; color:var(--steel);">${cat}</td>
                        ${ACTION_ORDER.map(a => {
                          const idsForAction = catPerms.filter(p => p.action === a).map(p => p.id);
                          if (idsForAction.length === 0) return `<td style="text-align:center; color:var(--border);">—</td>`;
                          const allChecked = idsForAction.every(id => pendingGrantedIds.has(id));
                          return `<td style="text-align:center;"><input type="checkbox" class="perm-category-checkbox" data-category="${cat}" data-action="${a}" ${allChecked ? 'checked' : ''} style="width:auto;" /></td>`;
                        }).join('')}
                      </tr>`;

                      // Sub-head rows nested under the category
                      subHeads.forEach(sh => {
                        const shPerms = catPerms.filter(p => p.sub_head === sh);
                        rowsHtml += `<tr>
                          <td style="padding-left:28px;">${SUB_HEAD_LABELS[sh] || sh}</td>
                          ${ACTION_ORDER.map(a => {
                            const perm = shPerms.find(p => p.action === a);
                            if (!perm) return `<td style="text-align:center; color:var(--border);">—</td>`;
                            return `<td style="text-align:center;"><input type="checkbox" class="perm-cell-checkbox" data-permission-id="${perm.id}" data-category="${cat}" data-action="${a}" ${pendingGrantedIds.has(perm.id) ? 'checked' : ''} style="width:auto;" /></td>`;
                          }).join('')}
                        </tr>`;
                      });

                      return rowsHtml;
                    }).join('')}
                  </tbody>
                </table>
              <div class="msg" id="permMsg"></div>
            `}
          `}
        </div>
      </div>
    </div>`;

    document.getElementById('adminPanelContent').innerHTML = html;

    // Freeze the table's column headers directly below the sticky employee-info/buttons row,
    // within the right panel's own scroll region
    const permStickyHeader = document.getElementById('permDetailStickyHeader');
    if (permStickyHeader) {
      const h = permStickyHeader.offsetHeight;
      document.querySelectorAll('.perm-grid-table thead th').forEach(th => { th.style.top = h + 'px'; });
    }

    document.getElementById('permSearchInput').addEventListener('input', (ev) => {
      permSearchQuery = ev.target.value;
      renderAdminPanel();
      const el = document.getElementById('permSearchInput');
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    });
    document.getElementById('permDeptFilterSelect').addEventListener('change', (ev) => { permDeptFilter = ev.target.value; renderAdminPanel(); });
    document.getElementById('permStatusFilterSelect').addEventListener('change', (ev) => { permStatusFilter = ev.target.value; renderAdminPanel(); });

    document.querySelectorAll('.perm-emp-row').forEach(btn => {
      btn.addEventListener('click', () => selectPermEmployee(btn.dataset.id));
    });

    document.querySelectorAll('.perm-cell-checkbox').forEach(cb => {
      cb.addEventListener('change', (ev) => {
        const pid = ev.target.dataset.permissionId;
        if (ev.target.checked) pendingGrantedIds.add(pid); else pendingGrantedIds.delete(pid);
        permDirty = true;
        renderAdminPanel();
      });
    });

    document.querySelectorAll('.perm-category-checkbox').forEach(cb => {
      cb.addEventListener('change', (ev) => {
        const cat = ev.target.dataset.category;
        const action = ev.target.dataset.action;
        const permIds = permissions.filter(p => p.category === cat && p.action === action).map(p => p.id);
        if (ev.target.checked) permIds.forEach(id => pendingGrantedIds.add(id));
        else permIds.forEach(id => pendingGrantedIds.delete(id));
        permDirty = true;
        renderAdminPanel();
      });
    });

    document.querySelectorAll('.perm-col-header').forEach(th => {
      th.addEventListener('click', () => {
        const action = th.dataset.action;
        const permIdsForAction = permissions.filter(p => p.action === action).map(p => p.id);
        const allChecked = permIdsForAction.every(id => pendingGrantedIds.has(id));
        if (allChecked) permIdsForAction.forEach(id => pendingGrantedIds.delete(id));
        else permIdsForAction.forEach(id => pendingGrantedIds.add(id));
        permDirty = true;
        renderAdminPanel();
      });
    });

    document.getElementById('permGrantAllBtn')?.addEventListener('click', () => {
      permissions.forEach(p => pendingGrantedIds.add(p.id));
      permDirty = true;
      renderAdminPanel();
    });
    document.getElementById('permRevokeAllBtn')?.addEventListener('click', () => {
      pendingGrantedIds.clear();
      permDirty = true;
      renderAdminPanel();
    });

    document.getElementById('permSaveBtn')?.addEventListener('click', async () => {
      const btn = document.getElementById('permSaveBtn');
      const msg = document.getElementById('permMsg');
      setButtonLoading(btn, true, 'Saving');
      const res = await apiPermissions({
        action: 'bulk_set_permissions',
        employee_id: selectedPermEmployeeId,
        permission_ids: [...pendingGrantedIds],
      });
      if (res.success) {
        permissionsData.grants = permissionsData.grants.filter(g => g.employee_id !== selectedPermEmployeeId)
          .concat([...pendingGrantedIds].map(pid => ({ employee_id: selectedPermEmployeeId, permission_id: pid })));
        permDirty = false;
        renderAdminPanel();
        setTimeout(() => {
          const m = document.getElementById('permMsg');
          if (m) { m.className = 'msg success'; m.textContent = 'Saved.'; setTimeout(() => { m.className = 'msg'; m.textContent = ''; }, 1800); }
        }, 50);
      } else {
        setButtonLoading(btn, false);
        if (msg) { msg.className = 'msg error'; msg.textContent = res.error || 'Failed to save.'; }
      }
    });
  }

  // ============ VENDOR MASTER (v2 — branch-centric) ============
  const VENDOR_STATUS_TAG = { draft: 'pending_evening', pending_approval: 'calculated', approved: 'approved', rejected: 'rejected', suspended: 'calculated' };
  let vendorListSearchQuery = '';
  let vendorListStatusFilter = 'all';
  let vendorListPageSize = 25;
  let vendorListCurrentPage = 1;
  let pendingVendorContacts = [];

  async function loadVendorMaster() {
    vendorMasterLoaded = true;
    showSpinner('vendorMasterContent');
    const [ddRes, listRes] = await Promise.all([
      apiVendor({ action: 'get_vendor_dropdowns' }),
      apiVendor({ action: 'get_vendor_list' }),
    ]);
    if (!ddRes.success) {
      document.getElementById('vendorMasterContent').innerHTML = `<div class="panel"><div class="panel-body msg error" style="display:block;">${ddRes.error}</div></div>`;
      return;
    }
    vendorDropdowns = ddRes;
    vendorListData = listRes.success ? listRes.vendors : [];
    switchVendorView('list');
  }

  function switchVendorView(view, vendorId) {
    if (view === 'list') renderVendorMasterList();
    else if (view === 'add') { pendingVendorContacts = []; renderVendorForm('company'); }
    else if (view === 'view') openVendorView(vendorId);
  }

  // ---------------- LIST SCREEN ----------------
  function renderVendorMasterList() {
    const searchQ = vendorListSearchQuery.trim();
    const searchQLower = searchQ.toLowerCase();
    const filtered = vendorListData.filter(v => {
      const statusMatch = vendorListStatusFilter === 'all' ? true : v.status === vendorListStatusFilter;
      if (!statusMatch) return false;
      if (!searchQLower) return true;
      const hay = [v.vendor_name, v.vendor_alias, v.vendor_code, v.pan, v.aadhar_number, v.deals_in, v.primary_contact_name, v.primary_contact_mobile].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(searchQLower);
    });

    const totalPages = Math.max(1, Math.ceil(filtered.length / vendorListPageSize));
    if (vendorListCurrentPage > totalPages) vendorListCurrentPage = totalPages;
    const pageStart = (vendorListCurrentPage - 1) * vendorListPageSize;
    const pageItems = filtered.slice(pageStart, pageStart + vendorListPageSize);

    let html = `<div class="panel">
      <div class="panel-header emp-list-sticky-header" style="flex-wrap:wrap; gap:10px;">
        <span class="panel-title">Vendors<span class="count-chip">${filtered.length}</span></span>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <input type="text" id="vendorSearchInput" placeholder="Search by name, alias, PAN, GST, contact..." value="${searchQ}" style="width:230px; padding:7px 10px; font-size:12.5px; border:1px solid var(--border); border-radius:6px; background:#fff;" />
          <select id="vendorStatusFilterSelect" style="padding:7px 10px; font-size:12.5px; border:1px solid var(--border); border-radius:6px; background:var(--surface-sunken);">
            <option value="all" ${vendorListStatusFilter === 'all' ? 'selected' : ''}>All Statuses</option>
            <option value="draft" ${vendorListStatusFilter === 'draft' ? 'selected' : ''}>Draft</option>
            <option value="pending_approval" ${vendorListStatusFilter === 'pending_approval' ? 'selected' : ''}>Pending Approval</option>
            <option value="approved" ${vendorListStatusFilter === 'approved' ? 'selected' : ''}>Approved</option>
            <option value="rejected" ${vendorListStatusFilter === 'rejected' ? 'selected' : ''}>Rejected</option>
            <option value="suspended" ${vendorListStatusFilter === 'suspended' ? 'selected' : ''}>Suspended</option>
          </select>
          <select id="vendorPageSizeSelect" style="padding:7px 10px; font-size:12.5px; border:1px solid var(--border); border-radius:6px; background:var(--surface-sunken);">
            <option value="10" ${vendorListPageSize === 10 ? 'selected' : ''}>10 / Page</option>
            <option value="25" ${vendorListPageSize === 25 ? 'selected' : ''}>25 / Page</option>
            <option value="50" ${vendorListPageSize === 50 ? 'selected' : ''}>50 / Page</option>
            <option value="100" ${vendorListPageSize === 100 ? 'selected' : ''}>100 / Page</option>
          </select>
          <button class="btn btn-sm" id="newVendorBtn" title="Add New Vendor">+ Add</button>
        </div>
      </div>
      <table class="ledger emp-dept-table"><thead><tr>
        <th>Code</th><th>Name</th><th>Alias</th><th>Type</th><th>Deals In</th><th>PAN / Aadhar</th><th>Contact</th><th>Status</th>
      </tr></thead><tbody>
        ${pageItems.length === 0 ? '<tr><td colspan="8" style="text-align:center; color:var(--muted); padding:16px;">No vendors match.</td></tr>' : pageItems.map(v => `
          <tr class="${v.status === 'approved' ? 'row-approved' : v.status === 'rejected' ? 'row-open' : 'row-pending'}">
            <td data-label="Code" class="mono">${highlightMatch(v.vendor_code, searchQ)}</td>
            <td data-label="Name"><a href="#" class="vendor-view-link" data-id="${v.id}" style="color:var(--steel); font-weight:600; text-decoration:none;">${highlightMatch(v.vendor_name, searchQ)}</a></td>
            <td data-label="Alias">${highlightMatch(v.vendor_alias, searchQ)}</td>
            <td data-label="Type">${v.vendor_type === 'individual' ? 'Individual/Contractor' : 'Company'}</td>
            <td data-label="Deals In">${highlightMatch(v.deals_in, searchQ)}</td>
            <td data-label="PAN / Aadhar" class="mono">${highlightMatch(v.pan || v.aadhar_number, searchQ)}</td>
            <td data-label="Contact">${highlightMatch(v.primary_contact_name, searchQ)} · ${highlightMatch(v.primary_contact_mobile, searchQ)}</td>
            <td data-label="Status"><span class="status-tag ${VENDOR_STATUS_TAG[v.status] || 'pending_evening'}">${v.status.replace('_',' ')}</span></td>
          </tr>`).join('')}
      </tbody></table>
      <div class="emp-pagination">
        <span>Showing ${filtered.length === 0 ? 0 : pageStart + 1}–${Math.min(pageStart + vendorListPageSize, filtered.length)} of ${filtered.length}</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <button type="button" class="btn btn-sm btn-outline" id="vendorPagePrevBtn" ${vendorListCurrentPage <= 1 ? 'disabled' : ''}>‹ Prev</button>
          <span style="font-size:12.5px; color:var(--muted);">Page ${vendorListCurrentPage} of ${totalPages}</span>
          <button type="button" class="btn btn-sm btn-outline" id="vendorPageNextBtn" ${vendorListCurrentPage >= totalPages ? 'disabled' : ''}>Next ›</button>
        </div>
      </div>
    </div>`;

    document.getElementById('vendorMasterContent').innerHTML = html;

    const stickyHeader = document.querySelector('#vendorMasterContent .emp-list-sticky-header');
    if (stickyHeader) {
      const h = stickyHeader.offsetHeight;
      document.querySelectorAll('#vendorMasterContent .emp-dept-table thead th').forEach(th => { th.style.top = h + 'px'; });
    }

    document.getElementById('vendorSearchInput').addEventListener('input', (ev) => {
      vendorListSearchQuery = ev.target.value;
      vendorListCurrentPage = 1;
      renderVendorMasterList();
      const el = document.getElementById('vendorSearchInput');
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    });
    document.getElementById('vendorStatusFilterSelect').addEventListener('change', (ev) => { vendorListStatusFilter = ev.target.value; vendorListCurrentPage = 1; renderVendorMasterList(); });
    document.getElementById('vendorPageSizeSelect').addEventListener('change', (ev) => { vendorListPageSize = Number(ev.target.value); vendorListCurrentPage = 1; renderVendorMasterList(); });
    document.getElementById('vendorPagePrevBtn').addEventListener('click', () => { vendorListCurrentPage = Math.max(1, vendorListCurrentPage - 1); renderVendorMasterList(); });
    document.getElementById('vendorPageNextBtn').addEventListener('click', () => { vendorListCurrentPage++; renderVendorMasterList(); });
    document.getElementById('newVendorBtn').addEventListener('click', () => switchVendorView('add'));
    document.querySelectorAll('.vendor-view-link').forEach(link => {
      link.addEventListener('click', (ev) => { ev.preventDefault(); switchVendorView('view', link.dataset.id); });
    });
  }

  // ---------------- ADD SCREEN (separate full screen, Employee Master style) ----------------
  const CONTACT_FIELDS_V = [
    { key: 'name', label: 'Name' }, { key: 'mobile', label: 'Mobile' }, { key: 'email', label: 'Email' }, { key: 'designation', label: 'Designation / Role' },

  async function saveVendorForm(isIndividual) {
    const btn = document.getElementById('vendorSaveBtn');
    const msg = document.getElementById('vendorFormMsg');
    msg.className = 'msg';
    const val = (id) => document.getElementById(id)?.value.trim() || null;
    const vendorTags = isIndividual ? [] : getMultiSelectValues('vf_vendor_tags');

    const core = {
      vendor_type: isIndividual ? 'individual' : 'company',
      vendor_name: val('vf_vendor_name'),
      vendor_alias: val('vf_vendor_alias'),
      deals_in: val('vf_deals_in'),
      pan: !isIndividual ? val('vf_pan')?.toUpperCase() : null,
      aadhar_number: isIndividual ? val('vf_aadhar_number') : null,
      is_trader: vendorTags.includes('Trader'), is_manufacturer: vendorTags.includes('Manufacturer'),
      is_exporter: vendorTags.includes('Exporter'), is_service_provider: vendorTags.includes('Service Provider'),
      msme_registered: val('vf_msme_registered') === 'yes',
      msme_number: val('vf_msme_registered') === 'yes' ? val('vf_msme_number') : null,
      primary_contact_name: isIndividual ? val('vf_vendor_name') : val('vf_primary_contact_name'),
      primary_contact_mobile: val('vf_primary_contact_mobile'),
      other_numbers: val('vf_other_numbers'),
      primary_contact_email: val('vf_primary_contact_email'),
    };
    const branch = {
      branch_name: val('vf_branch_name'), branch_alias: val('vf_branch_alias'),
      gstin: !isIndividual ? val('vf_gstin')?.toUpperCase() : null,
      address: val('vf_branch_address'), state_id: val('vf_branch_state_id'), city_id: val('vf_branch_city_id'),
      pincode: val('vf_branch_pincode'), location_url: val('vf_branch_location_url'),
      contact: { name: val('vf_branch_contact_name'), mobile: val('vf_branch_contact_mobile'), email: val('vf_branch_contact_email'), designation: val('vf_branch_contact_designation') },
    };
    const bank = { bank_name: val('vf_bank_name'), account_number: val('vf_account_number'), ifsc: val('vf_ifsc')?.toUpperCase(), branch: val('vf_bank_branch'), holder_name: core.vendor_name };

    const errors = [];
    const err = (label, targetId) => errors.push({ label, targetId });
    if (!core.vendor_name) err(isIndividual ? 'Individual Name' : 'Company Name', 'vf_vendor_name');
    if (!core.deals_in) err('Deals In', 'vf_deals_in');
    if (!isIndividual && !core.pan) err('PAN Number', 'vf_pan');
    else if (!isIndividual && !/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(core.pan)) err('PAN format is invalid', 'vf_pan');
    if (isIndividual && !core.aadhar_number) err('Aadhar Number', 'vf_aadhar_number');
    else if (isIndividual && !/^[0-9]{12}$/.test(core.aadhar_number || '')) err('Aadhar Number must be 12 digits', 'vf_aadhar_number');
    if (!core.primary_contact_mobile) err('Primary Mobile', 'vf_primary_contact_mobile');
    else if (!/^[6-9][0-9]{9}$/.test(core.primary_contact_mobile)) err('Primary Mobile is invalid', 'vf_primary_contact_mobile');
    if (!isIndividual && !core.primary_contact_name) err('Primary Contact Name', 'vf_primary_contact_name');
    if (!isIndividual && vendorTags.length === 0) err('Vendor Is', 'vf_vendor_tags-trigger');
    if (!pendingUploads['pan_card']) err('PAN Card Upload', 'uploadBtn_pan_card');
    if (isIndividual && !pendingUploads['aadhar_card']) err('Aadhar Card Upload', 'uploadBtn_aadhar_card');
    if (!isIndividual && !pendingUploads['gst_certificate']) err('GST Certificate Upload', 'uploadBtn_gst_certificate');
    if (!isIndividual && core.msme_registered) {
      if (!core.msme_number) err('MSME Number', 'vf_msme_number');
      if (!pendingUploads['msme_certificate']) err('MSME Certificate Upload', 'uploadBtn_msme_certificate');
    }
    if (!branch.branch_name) err('Branch Name', 'vf_branch_name');
    if (!branch.address) err('Branch Address', 'vf_branch_address');
    if (!branch.state_id) err('Branch State', 'vf_branch_state_id');
    if (!isIndividual && !branch.gstin) err('GST Number', 'vf_gstin');
    if (!branch.contact.name) err('Branch Contact Name', 'vf_branch_contact_name');
    if (!branch.contact.mobile) err('Branch Contact Mobile', 'vf_branch_contact_mobile');
    if (!bank.bank_name) err('Bank Name', 'vf_bank_name');
    if (!bank.account_number) err('Account No.', 'vf_account_number');
    if (!bank.ifsc) err('IFSC Code', 'vf_ifsc');
    else if (!/^[A-Z]{4}0[0-9A-Z]{6}$/.test(bank.ifsc)) err('IFSC format is invalid', 'vf_ifsc');
    if (!pendingUploads['cancelled_cheque']) err('Cancelled Cheque Upload', 'uploadBtn_cancelled_cheque');

    document.querySelectorAll('.field-error-highlight').forEach(el => el.classList.remove('field-error-highlight'));
    if (errors.length > 0) {
      errors.forEach(e => document.getElementById(e.targetId)?.classList.add('field-error-highlight'));
      msg.className = 'msg error';
      msg.innerHTML = 'Please complete the following before saving:<br>• ' + errors.map(e => e.label).join('<br>• ');
      const firstEl = document.getElementById(errors[0].targetId);
      if (firstEl) { firstEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => firstEl.focus?.(), 350); }
      return;
    }

    setButtonLoading(btn, true, 'Saving');
    const res = await apiVendor({ action: 'create_vendor', core, branch, bank });
    if (!res.success) {
      setButtonLoading(btn, false);
      msg.className = 'msg error';
      msg.textContent = res.error;
      return;
    }
    const vendorId = res.vendor_id;
    const uploadPromises = Object.entries(pendingUploads).map(([slot, data]) =>
      apiVendor({ action: 'upload_document', vendor_id: vendorId, slot, file_base64: data.base64, file_ext: data.ext, document_name: data.document_name })
    );
    await Promise.all(uploadPromises);
    pendingUploads = {};

    setButtonLoading(btn, false);
    msg.className = 'msg success';
    msg.textContent = res.note || 'Saved successfully.';
    const listRes = await apiVendor({ action: 'get_vendor_list' });
    if (listRes.success) vendorListData = listRes.vendors;
    setTimeout(() => switchVendorView('list'), 1200);
  }

  async function saveAddBranch(vendorId, mode) {
    const btn = document.getElementById('ab_saveBtn');
    const msg = document.getElementById('ab_msg');
    msg.className = 'msg';
    const val = (id) => document.getElementById(id)?.value.trim() || null;
    const checked = (id) => document.getElementById(id)?.checked || false;

    const branch = {
      branch_name: val('ab_branch_name'), branch_alias: val('ab_branch_alias'), gstin: val('ab_gstin')?.toUpperCase(),
      address: val('ab_address'), state_id: val('ab_state_id'), city_id: val('ab_city_id'), pincode: val('ab_pincode'), location_url: val('ab_location_url'),
      contact: checked('ab_reuse_contact_toggle') ? { reuse_contact_id: val('ab_reuse_contact_select') } : { name: val('ab_contact_name'), mobile: val('ab_contact_mobile'), email: val('ab_contact_email'), designation: val('ab_contact_designation') },
    };
    const bank = checked('ab_reuse_bank_toggle') ? { reuse_bank_account_id: val('ab_reuse_bank_select') } : { bank_name: val('ab_bank_name'), account_number: val('ab_account_number'), ifsc: val('ab_ifsc')?.toUpperCase(), branch: val('ab_bank_branch') };

    if (!branch.branch_name || !branch.gstin || !branch.address || !branch.state_id) {
      msg.className = 'msg error'; msg.textContent = 'Branch Name, GSTIN, Address, and State are required.'; return;
    }

    setButtonLoading(btn, true, 'Saving');

    if (mode === 'different') {
      const core = { vendor_type: 'company', vendor_name: val('ab_vendor_name'), vendor_alias: val('ab_vendor_alias'), deals_in: val('ab_deals_in'), pan: val('ab_pan')?.toUpperCase(), primary_contact_mobile: branch.contact.mobile || (branch.contact.reuse_contact_id ? '9999999999' : null) };

        setButtonLoading(btn, false); msg.className = 'msg error'; msg.textContent = 'New Vendor Name, Deals In, and PAN are required.'; return;
      }

      setButtonLoading(btn, false);
      if (!res.success) { msg.className = 'msg error'; msg.textContent = res.error; return; }
      msg.className = 'msg success'; msg.textContent = 'New related vendor created.';
      setTimeout(() => openVendorView(vendorId), 1200);
    } else {
      const res = await apiVendor({ action: 'add_branch', vendor_id: vendorId, branch, bank });
      setButtonLoading(btn, false);
      if (!res.success) { msg.className = 'msg error'; msg.textContent = res.error; return; }
      msg.className = 'msg success'; msg.textContent = 'Branch added.';
      setTimeout(() => openVendorView(vendorId), 1200);
    }

  function docTreeGroupHtml(group, path, depth) {
    depth = depth || 0;
    const key = path ? path + ' > ' + group.label : group.label;
    const isExpanded = docTreeExpanded[key] !== false; // default expanded
    let html = `<button type="button" class="nav-item nav-parent doc-tree-toggle ${isExpanded ? 'expanded' : ''}" data-key="${key}" style="padding-left:16px;">

    </button>
    <div class="nav-children" style="${isExpanded ? '' : 'display:none'} margin-left:15px; border-left:1px solid var(--border); padding-left:0;">`;
    (group.children || []).forEach(child => { html += docTreeGroupHtml(child, key, depth + 1); });
    (group.leaves || []).forEach(leaf => {
      html += `<button type="button" class="nav-item doc-tree-leaf ${leaf.id === docActiveSection ? 'active' : ''}" data-section="${leaf.id}" style="padding-left:16px;">
        <span class="nav-label">${leaf.label}</span>
      </button>`;
    });
    html += `</div>`;
    return html;
  }

    const html = `<div class="panel panel-no-clip">

      <div style="display:flex; min-height:600px;">

          ${DOC_TREE.map(g => docTreeGroupHtml(g, '')).join('')}
        </div>

        <div style="flex:1; padding:24px 28px; min-width:0;">
          <h2 style="font-size:18px; font-weight:700; margin:0 0 4px;">${active.label}</h2>
          <p style="font-size:12.5px; color:var(--muted); margin:0 0 20px;">Every rule below reflects an actual decision made while building this module, along with why it was made that way.</p>

            </div>
          `).join('')}
        </div>
      </div>
    </div>`;

    document.getElementById('documentationContent').innerHTML = html;

    const docHeader = document.getElementById('docPanelHeader');

      // Re-measure once fonts/layout settle, in case the header's height shifts slightly after initial paint
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(applyOffset);
      setTimeout(applyOffset, 300);
    }

    document.querySelectorAll('.doc-tree-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.key;
        const currentlyExpanded = docTreeExpanded[key] !== false; // same logic used when rendering
        docTreeExpanded[key] = !currentlyExpanded;
        renderDocumentation();
      });
    });

  // This must stay the LAST statement in the script — it can trigger navigation to any view

  // need to already be defined by the time it runs.
  (function restoreSession() {
    const saved = sessionStorage.getItem('admin_session');
    if (!saved) return;
    try {
      currentUser = JSON.parse(saved);
      authGate.style.display = 'none';
      appShell.style.display = 'flex';
      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userRole').textContent = currentUser.role.toUpperCase();
      loadDashboard();
      const savedView = sessionStorage.getItem('admin_active_view');
      if (savedView) switchMainView(savedView);
    } catch (e) {
      sessionStorage.removeItem('admin_session');
    }
  })();
