<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REF ERP — Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root {
    --ink: #1a2229;
    --paper: #f4f6f8;
    --surface: #ffffff;
    --surface-sunken: #eef1f4;
    --border: #d8dee5;
    --steel: #2d4a5e;
    --steel-dark: #1f3547;
    --steel-tint: #e7edf1;
    --amber: #b7791f;
    --amber-bg: #fbf1de;
    --green: #2f7a52;
    --green-bg: #e7f3ec;
    --slate: #5b6b7a;
    --slate-bg: #eaedf0;
    --danger: #a13d33;
    --danger-bg: #fbeceb;
    --muted: #6b7684;
    --sidebar-w: 232px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    font-size: 14px;
  }
  h1, h2, h3, .label-face { font-family: 'IBM Plex Sans', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  #authGate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .auth-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px 26px;
  }
  .auth-brand { font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 2px; color: var(--steel); margin-bottom: 4px; }
  .auth-title { font-size: 20px; font-weight: 650; margin: 0 0 22px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  .field input, .field select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 11px;
    font-size: 14px;
    font-family: inherit;
    background: var(--surface-sunken);
    outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--steel); background: #fff; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: var(--steel);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    font-family: 'IBM Plex Sans', sans-serif;
    cursor: pointer;
  }
  .btn:hover { background: var(--steel-dark); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.btn-loading {
    background: var(--muted) !important;
    color: #fff !important;
    cursor: wait;
    opacity: 1;
  }
  .btn.btn-loading::after {
    content: '';
    width: 12px; height: 12px;
    margin-left: 4px;
    border: 2px solid rgba(255,255,255,0.5);
    border-top-color: #fff;
    border-radius: 50%;
    display: inline-block;
    animation: btn-spin 0.6s linear infinite;
  }
  @keyframes btn-spin { to { transform: rotate(360deg); } }
  .btn-block { width: 100%; }
  .btn-outline { background: transparent; border-color: var(--border); color: var(--ink); }
  .btn-outline:hover { background: var(--surface-sunken); }
  .btn-danger { background: var(--danger); }
  .btn-danger:hover { background: #872f27; }
  .btn-sm { padding: 6px 11px; font-size: 12px; }

  .msg { margin-top: 12px; padding: 9px 11px; border-radius: 6px; font-size: 12.5px; display: none; line-height: 1.5; }
  .msg.error { display: block; background: var(--danger-bg); border: 1px solid #efd2cf; color: var(--danger); }
  .msg.success { display: block; background: var(--green-bg); border: 1px solid #cfe4d8; color: var(--green); }

  .app-shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w);
    background: var(--steel-dark);
    color: #fff;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-brand { padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .sidebar-brand .name { font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 1.5px; }
  .sidebar-brand .tag { font-size: 10.5px; color: rgba(255,255,255,0.55); letter-spacing: 1.5px; margin-top: 2px; }
  .sidebar-nav { flex: 1; padding: 14px 10px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.72);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 3px;
    border-left: 3px solid transparent;
    text-align: left;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item.active { background: rgba(255,255,255,0.09); color: #fff; border-left-color: var(--amber); font-weight: 600; }
  .nav-item svg { flex-shrink: 0; width: 17px; height: 17px; }
  .nav-item .nav-label { flex: 1; }
  .nav-arrow { width: 12px !important; height: 12px !important; opacity: 0.45; }
  .nav-children { padding-left: 0; }
  .nav-item.level-2 { font-size: 12.5px; padding-left: 34px; }
  .nav-item.level-3 { font-size: 12px; padding-left: 46px; color: rgba(255,255,255,0.62); }
  .nav-item.level-3.active { color: #fff; }
  .nav-item.nav-parent.level-2 .nav-arrow { margin-left: auto; }
  .nav-section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.32);
    padding: 12px 20px 4px 34px;
  }
  /* Distinct accent colors per icon, matching the reference's colorful style */
  .ic-blue { color: #5b9bd5; }
  .ic-slate { color: #9aa7b5; }
  .ic-teal { color: #4fb8a6; }
  .ic-purple { color: #b28ce0; }
  .ic-amber { color: var(--amber); }
  .sidebar-footer { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 11.5px; color: rgba(255,255,255,0.5); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar-title { font-size: 17px; font-weight: 650; }
  .topbar-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .user-chip { font-size: 12.5px; color: var(--muted); text-align: right; }
  .user-chip .name { color: var(--ink); font-weight: 600; }

  .content { padding: 24px 28px; flex: 1; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .panel-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-header.header-pending { background: var(--amber-bg); border-bottom-color: #ecd9ae; }
  .panel-header.header-recent { background: var(--slate-bg); border-bottom-color: #d2d9df; }
  .panel-title { font-size: 13.5px; font-weight: 650; font-family: 'IBM Plex Sans', sans-serif; }
  .section-label { font-size: 12.5px; font-weight: 700; color: var(--steel); text-transform: uppercase; letter-spacing: 0.4px; margin: 20px 0 10px; padding-top: 14px; border-top: 1px solid var(--border); }
  .category-content, .cptab-content, .etab-content, .hrtab-content { }
  .panel-body { padding: 18px; }
  .count-chip { font-size: 11px; font-weight: 700; background: var(--amber); color: #fff; padding: 2px 8px; border-radius: 4px; margin-left: 6px; }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px; height: 30px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--steel);
    cursor: pointer;
    padding: 0;
  }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn:hover { background: var(--surface-sunken); }
  .icon-btn-danger { color: var(--danger); border-color: #efd2cf; }
  .icon-btn-danger:hover { background: var(--danger-bg); }
  .icon-btn-warn { color: var(--amber); border-color: #ecd9ae; }
  .icon-btn-warn:hover { background: var(--amber-bg); }
  .icon-btn-success { color: var(--green); border-color: #cfe4d8; }
  .icon-btn-success:hover { background: var(--green-bg); }

  .view-value {
    padding: 10px 11px;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13.5px;
    color: var(--ink);
    min-height: 20px;
  }

  .empty-state { text-align: center; color: var(--muted); font-size: 13px; padding: 32px 0; }

  .table-scroll { max-height: 480px; overflow-y: auto; }
  table.ledger { width: 100%; border-collapse: collapse; }
  table.ledger th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
    font-weight: 600;
    padding: 10px 12px;
    background: var(--surface-sunken);
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 2;
  }
  table.ledger th:last-child { border-right: none; }
  table.ledger td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    vertical-align: middle;
    font-size: 13px;
  }
  table.ledger td:last-child { border-right: none; }
  table.ledger tr:last-child td { border-bottom: none; }
  table.ledger tr.row-pending { background: #fffdf8; }
  table.ledger tr.row-pending td:first-child { border-left: 3px solid var(--amber); }
  table.ledger tr.row-approved td:first-child { border-left: 3px solid var(--green); }
  table.ledger tr.row-rejected { background: #fdf7f6; }
  table.ledger tr.row-rejected td:first-child { border-left: 3px solid var(--danger); }
  table.ledger tr.row-paid td:first-child { border-left: 3px solid var(--slate); }
  table.ledger tr.row-open td:first-child { border-left: 3px solid var(--border); }

  .photo-thumb {
    width: 40px; height: 40px;
    border-radius: 5px;
    object-fit: cover;
    border: 1px solid var(--border);
    cursor: pointer;
    background: var(--surface-sunken);
  }
  .photo-missing {
    width: 40px; height: 40px;
    border-radius: 5px;
    border: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 9px;
    text-align: center;
    background: var(--surface-sunken);
  }
  .reading-cell { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; }
  .reading-cell .time { color: var(--muted); font-size: 10.5px; display: block; margin-top: 1px; }
  .num-cell { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; }

  .status-tag { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
  .status-tag.calculated { background: var(--amber-bg); color: var(--amber); }
  .status-tag.approved { background: var(--green-bg); color: var(--green); }
  .status-tag.rejected { background: var(--danger-bg); color: var(--danger); }
  .status-tag.paid { background: var(--slate-bg); color: var(--slate); }
  .status-tag.pending_evening { background: var(--surface-sunken); color: var(--muted); }
  .rejection-note { font-size: 11px; color: var(--danger); margin-top: 3px; font-style: italic; }

  .lightbox {
    position: fixed; inset: 0; background: rgba(20,26,32,0.88);
    display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 80vh; border-radius: 6px; }
  .lightbox-caption { position: absolute; bottom: 24px; color: #fff; font-size: 13px; text-align: center; }
  .lightbox-close { position: absolute; top: 20px; right: 24px; color: #fff; font-size: 28px; cursor: pointer; background: none; border: none; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .form-grid .field.full { grid-column: 1 / -1; }

  .roster-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .roster-item:last-child { border-bottom: none; }
  .roster-name { font-weight: 600; font-size: 13.5px; }
  .roster-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .role-tag { font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: var(--steel-tint); color: var(--steel); text-transform: uppercase; margin-left: 7px; }

  .subtabs {
    display: flex;
    gap: 24px;
    padding: 0 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .subtab-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 13px 2px;
    border: none;
    background: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
  }
  .subtab-item svg { width: 15px; height: 15px; flex-shrink: 0; }
  .subtab-item:hover { color: var(--steel); }
  .subtab-item.active { color: var(--steel); border-bottom-color: var(--steel); }
  .subtab-settings { margin-left: auto; padding: 13px 4px; }

  .nav-future-note {
    padding: 10px 20px;
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    font-style: italic;
    border-top: 1px solid rgba(255,255,255,0.08);
    margin-top: 10px;
    line-height: 1.5;
  }

  @media (max-width: 880px) {
    .sidebar { display: none; }
    .content { padding: 14px; }
    .topbar { padding: 12px 14px; }
    .subtabs { padding: 0 14px 0; -webkit-overflow-scrolling: touch; }
    .subtab-item { padding: 12px 2px; font-size: 12.5px; }
    .form-grid { grid-template-columns: 1fr; gap: 10px; }
    .panel-body { padding: 14px; }

    /* Prevent iOS Safari from auto-zooming when tapping inputs */
    input, select, textarea { font-size: 16px !important; }

    /* Compact topbar on small screens: role text hides, name stays */
    .topbar-title { font-size: 15.5px; }
    .topbar-sub { font-size: 11px; }
    .user-chip { font-size: 12px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-chip #userRole { display: none; }

    /* Roster rows (employees/vehicles/payments) must wrap instead of overflowing off-screen */
    .roster-item {
      flex-wrap: wrap;
      gap: 8px;
    }
    .roster-item > div:first-child { flex: 1 1 100%; }
    .roster-item > div:last-child {
      flex: 1 1 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-start;
    }

    /* Vehicle-assignment control row (select + Assign button) */
    .roster-item select.assign-vehicle-select {
      max-width: 100% !important;
      flex: 1 1 auto;
    }

    /* Modals: never exceed viewport height, scroll internally if content + keyboard is tall */
    .auth-card {
      max-height: 88vh;
      overflow-y: auto;
      width: calc(100% - 20px);
      padding: 22px 18px;
    }

    /* Button groups inside table action cells must wrap on very narrow phones */
    table.ledger td.action-cell > div { flex-wrap: wrap; justify-content: flex-end; }

    /* Standalone submit buttons: full-width for easier tapping on mobile */
    #addEmpBtn, #addVehBtn, #saveSettingsBtn { width: 100%; }

    .table-scroll { max-height: none; overflow: visible; }
    table.ledger thead { display: none; }
    table.ledger, table.ledger tbody, table.ledger tr, table.ledger td { display: block; width: 100%; }
    table.ledger tr {
      border: 1px solid var(--border);
      border-radius: 7px;
      margin-bottom: 10px;
      padding: 4px 0;
      border-left-width: 1px !important;
    }
    table.ledger tr.row-pending { border-left: 3px solid var(--amber) !important; }
    table.ledger tr.row-approved { border-left: 3px solid var(--green) !important; }
    table.ledger tr.row-paid { border-left: 3px solid var(--slate) !important; }
    table.ledger td {
      border-bottom: none;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    table.ledger td::before {
      content: attr(data-label);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted);
      font-weight: 600;
      flex-shrink: 0;
    }
    table.ledger td.action-cell { justify-content: flex-end; padding-top: 10px; }
  }
</style>
</head>
<body>

<div id="authGate">
  <div class="auth-card">
    <div class="auth-brand">REF ERP</div>
    <p class="auth-title">Admin Sign-in</p>
    <div class="field"><label>Mobile Number</label><input type="tel" id="loginMobile" /></div>
    <div class="field"><label>PIN</label><input type="password" id="loginPin" /></div>
    <button class="btn btn-block" id="loginBtn">Sign in</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<div class="app-shell" id="appShell" style="display:none">
  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="name">REF</div>
      <div class="tag">ERP</div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <button class="nav-item active" data-view="km-tracker">
        <svg class="ic-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 17h14M5 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM19 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM3 17V9l2-5h10l4 5h2v8"/></svg>
        <span class="nav-label">Km Tracker</span>
      </button>

      <button class="nav-item nav-parent" data-toggle="tree-control-panel">
        <svg class="ic-slate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="nav-label">Control Panel</span>
        <svg class="nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <div class="nav-children" id="tree-control-panel" style="display:none">

        <div class="nav-section-label">Masters</div>
        <button class="nav-item nav-parent level-2" data-toggle="tree-hr">
          <svg class="ic-teal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
          <span class="nav-label">HR</span>
          <svg class="nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <div class="nav-children" id="tree-hr" style="display:none">
          <button class="nav-item level-3" data-view="employee-master">
            <svg class="ic-teal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75M13 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
            <span class="nav-label">Employee Master</span>
          </button>
          <button class="nav-item level-3" data-view="hr-dropdowns">
            <svg class="ic-purple" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h9"/></svg>
            <span class="nav-label">HR Dropdowns</span>
          </button>
        </div>

        <div class="nav-section-label">System</div>
        <button class="nav-item level-2" data-view="admin-panel">
          <svg class="ic-amber" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l7 4v6c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/></svg>

<div class="lightbox" id="rejectModal">

    <p class="auth-title" style="margin-bottom:14px;">Reject Entry</p>
    <div class="field">
      <label>Reason for rejection (required)</label>
      <textarea id="rejectReasonInput" rows="3" style="width:100%; border:1px solid var(--border); border-radius:6px; padding:10px 11px; font-family:inherit; font-size:14px; background:var(--surface-sunken); outline:none; resize:vertical;"></textarea>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-outline" id="rejectCancelBtn" style="flex:1">Cancel</button>
      <button class="btn btn-danger" id="rejectConfirmBtn" style="flex:1">Reject Entry</button>
    </div>
    <div class="msg" id="rejectMsg"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://mamamjohuuacxezcwgqv.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_uqu742FOxl_J1VqWOsrtjw_-Ja4QfNa";

  let currentUser = null;
  let dashboardData = null;

  function setButtonLoading(btn, isLoading, loadingText, originalText) {
    if (isLoading) {
      btn.dataset.originalText = originalText !== undefined ? originalText : btn.textContent;
      btn.disabled = true;
      btn.classList.add('btn-loading');
      btn.textContent = loadingText || 'Processing';
    } else {
      btn.disabled = false;
      btn.classList.remove('btn-loading');
      btn.textContent = btn.dataset.originalText || originalText || btn.textContent;
    }
  }

  const authGate = document.getElementById('authGate');
  const appShell = document.getElementById('appShell');
  const loginMsg = document.getElementById('loginMsg');

  const pageTitles = {
    approvals: ['Approvals', 'Entries waiting for your review'],
    employees: ['Employees', 'Manage team members, roles, and rates'],
    vehicles: ['Vehicles', 'Manage company and employee-owned vehicles'],
    reports: ['Reports', 'Browse and filter all vehicle log entries'],
    payments: ['Payments', 'See what is owed and record payments made'],
    settings: ['Settings', 'Configure system-wide rules'],
  };

  async function apiLogin(mobile, pin) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ mobile_number: mobile, pin })
    });
    return res.json();
  }

  async function apiAdmin(payload) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-actions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ requester_id: currentUser.id, ...payload })
    });
    return res.json();
  }

  async function apiHR(payload) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/hr-actions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ requester_id: currentUser.id, ...payload })
    });
    return res.json();
  }

  let controlPanelLoaded = false;
  let dropdownsData = null;
  let employeeListData = null;

  async function loadControlPanel() {
    controlPanelLoaded = true;
    const dd = await apiHR({ action: 'get_dropdowns' });
    if (dd.success) dropdownsData = dd.dropdowns;
    const el = await apiHR({ action: 'get_employee_list' });
    if (el.success) employeeListData = el.employees;
    renderHRDropdowns();
    renderEmployeeMasterList();
  }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const mobile = document.getElementById('loginMobile').value.trim();
    const pin = document.getElementById('loginPin').value.trim();
    loginMsg.className = 'msg';
    const btn = document.getElementById('loginBtn');
    setButtonLoading(btn, true, 'Signing in');
    const data = await apiLogin(mobile, pin);
    setButtonLoading(btn, false);
    if (data.success) {
      if (!['admin', 'owner'].includes(data.employee.role)) {
        loginMsg.className = 'msg error';
        loginMsg.textContent = 'This login does not have admin access.';
        return;
      }
      currentUser = data.employee;
      authGate.style.display = 'none';
      appShell.style.display = 'flex';
      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userRole').textContent = currentUser.role.toUpperCase();
      loadDashboard();
    } else {
      loginMsg.className = 'msg error';
      loginMsg.textContent = data.error || 'Login failed.';
    }
  });

  // --- Sidebar tree: expandable parents (Control Panel, Masters, HR) ---
  document.querySelectorAll('.nav-parent').forEach(btn => {
    btn.addEventListener('click', () => {
      const childrenEl = document.getElementById(btn.dataset.toggle);
      const isOpen = childrenEl.style.display !== 'none';
      childrenEl.style.display = isOpen ? 'none' : 'block';
      btn.classList.toggle('expanded', !isOpen);
    });
  });

  // --- Sidebar tree: leaf items (Km Tracker, Employee Master, HR Dropdowns, Admin Panel) ---
  const viewTitles = {
    'km-tracker': ['Km Tracker', 'Daily odometer tracking, approvals, and payments'],
    'employee-master': ['Employee Master', 'Add and manage employee records'],
    'hr-dropdowns': ['HR Dropdowns', 'Supporting master data used across HR'],
    'admin-panel': ['Admin Panel', 'Role-based permissions and administration'],
  };
  document.querySelectorAll('.nav-item[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-item[data-view]').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.view-content').forEach(v => v.style.display = 'none');
      document.getElementById('view-' + btn.dataset.view).style.display = 'block';
      document.getElementById('pageTitle').textContent = viewTitles[btn.dataset.view][0];
      document.getElementById('pageSub').textContent = viewTitles[btn.dataset.view][1];

      if (['employee-master', 'hr-dropdowns', 'admin-panel'].includes(btn.dataset.view) && !controlPanelLoaded) {
        loadControlPanel();
      }
    });
  });

  // --- Km Tracker's own subtabs (Approvals / Reports / Payments / Settings) ---
  function switchTab(tab) {
    document.querySelectorAll('#subtabsNav .subtab-item').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    document.querySelectorAll('#view-km-tracker .tab-content').forEach(c => c.style.display = 'none');
    document.getElementById('tab-' + tab).style.display = 'block';
  }
  document.querySelectorAll('#subtabsNav .subtab-item').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  function openLightbox(url, caption) {
    document.getElementById('lightboxImg').src = url;
    document.getElementById('lightboxCaption').textContent = caption || '';
    document.getElementById('lightbox').classList.add('open');
  }
  document.getElementById('lightboxClose').addEventListener('click', () => document.getElementById('lightbox').classList.remove('open'));
  document.getElementById('lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') e.currentTarget.classList.remove('open'); });

  async function loadDashboard() {
    document.getElementById('tab-approvals').innerHTML = '<div class="empty-state">Loading...</div>';
    const data = await apiAdmin({ action: 'get_dashboard' });
    if (!data.success) {
      document.getElementById('tab-approvals').innerHTML = `<div class="msg error" style="display:block">${data.error}</div>`;
      return;
    }
    dashboardData = data;
    renderApprovals();
    renderReports();
    renderPayments();
    renderSettings();
  }

  function photoCell(url, missing, label, time, location) {
    if (url) {
      return `<img src="${url}" class="photo-thumb" onclick="openLightbox('${url}', '${label} · ${time || ''} · ${(location||'').replace(/'/g,"")}')" />`;
    }
    if (missing) return `<div class="photo-missing">no photo</div>`;
    return `<div class="photo-missing">—</div>`;
  }

  let pendingRejectId = null;

  function openRejectModal(entryId) {
    pendingRejectId = entryId;
    document.getElementById('rejectReasonInput').value = '';
    document.getElementById('rejectMsg').className = 'msg';
    document.getElementById('rejectModal').classList.add('open');
  }
  document.getElementById('rejectCancelBtn').addEventListener('click', () => {
    document.getElementById('rejectModal').classList.remove('open');
    pendingRejectId = null;
  });
  document.getElementById('rejectConfirmBtn').addEventListener('click', async () => {
    const reason = document.getElementById('rejectReasonInput').value.trim();
    const msg = document.getElementById('rejectMsg');
    const btn = document.getElementById('rejectConfirmBtn');
    msg.className = 'msg';
    if (!reason) {
      msg.className = 'msg error';
      msg.textContent = 'A reason is required to reject this entry.';
      return;
    }
    setButtonLoading(btn, true, 'Rejecting');
    const res = await apiAdmin({ action: 'reject_entry', entry_id: pendingRejectId, reason });
    setButtonLoading(btn, false);
    if (res.success) {
      document.getElementById('rejectModal').classList.remove('open');
      pendingRejectId = null;
      loadDashboard();
    } else {
      msg.className = 'msg error';
      msg.textContent = res.error || 'Failed to reject entry.';
    }
  });

  function buildTable(rows, showActions) {
    let html = `<div class="table-scroll"><table class="ledger"><thead><tr>
      <th>Employee</th><th>Date</th><th>Vehicle</th><th>Morning</th><th>Evening</th><th>KM</th><th>Cost</th><th>Status</th>${showActions ? '<th>Action</th>' : ''}
    </tr></thead><tbody>`;
    rows.forEach(e => {
      const rowClass = e.status === 'calculated' ? 'row-pending' : e.status === 'approved' ? 'row-approved' : e.status === 'rejected' ? 'row-rejected' : e.status === 'paid' ? 'row-paid' : 'row-open';
      const rejectionNote = e.status === 'rejected' && e.rejection_reason ? `<div class="rejection-note">Reason: ${e.rejection_reason}</div>` : '';
      html += `<tr class="${rowClass}">
        <td data-label="Employee">${e.employees?.name || '—'}</td>
        <td data-label="Date" class="mono">${e.entry_date}</td>
        <td data-label="Vehicle">${e.vehicles?.vehicle_name || '—'}</td>
        <td data-label="Morning">
          <div style="display:flex; align-items:center; gap:8px;">
            ${photoCell(e.morning_photo_signed_url, e.morning_photo_missing, 'Morning', e.morning_timestamp ? new Date(e.morning_timestamp).toLocaleTimeString() : '', e.morning_location_text)}
            <div class="reading-cell">${e.morning_reading ?? '—'}<span class="time">${e.morning_timestamp ? new Date(e.morning_timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''}</span></div>
          </div>
        </td>
        <td data-label="Evening">
          <div style="display:flex; align-items:center; gap:8px;">
            ${photoCell(e.evening_photo_signed_url, e.evening_photo_missing, 'Evening', e.evening_timestamp ? new Date(e.evening_timestamp).toLocaleTimeString() : '', e.evening_location_text)}
            <div class="reading-cell">${e.evening_reading ?? '—'}<span class="time">${e.evening_timestamp ? new Date(e.evening_timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''}</span></div>
          </div>
        </td>
        <td data-label="KM" class="num-cell">${e.km_traveled ?? '—'}</td>
        <td data-label="Cost" class="num-cell">${e.cost !== null ? '₹' + e.cost : '—'}</td>
        <td data-label="Status"><span class="status-tag ${e.status}">${e.status.replace('_',' ')}</span>${rejectionNote}</td>
        ${showActions ? `<td class="action-cell" data-label="">
          <div style="display:flex; gap:6px;">
            <button class="btn btn-sm approve-btn" data-id="${e.id}">Approve</button>
            <button class="btn btn-sm btn-danger reject-btn" data-id="${e.id}">Reject</button>
          </div>
        </td>` : ''}
      </tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  function renderApprovals() {
    const pending = dashboardData.entries.filter(e => e.status === 'calculated');

    let html = `<div class="panel">
      <div class="panel-header header-pending"><span class="panel-title">Pending Approval<span class="count-chip">${pending.length}</span></span></div>
      <div class="panel-body" style="padding:0">`;
    html += pending.length === 0 ? '<div class="empty-state">Nothing waiting for approval. See the Reports tab for full history.</div>' : buildTable(pending, true);
    html += `</div></div>`;

    document.getElementById('tab-approvals').innerHTML = html;

    document.querySelectorAll('.approve-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        setButtonLoading(btn, true, 'Approving');
        const res = await apiAdmin({ action: 'approve_entry', entry_id: btn.dataset.id });
        if (res.success) loadDashboard();
        else { alert(res.error || 'Failed to approve'); setButtonLoading(btn, false); }
      });
    });
    document.querySelectorAll('.reject-btn').forEach(btn => {
      btn.addEventListener('click', () => openRejectModal(btn.dataset.id));
    });
  }

  let activeFilters = { employee: '', vehicle: '', status: '', from: '', to: '' };

  function renderReports() {
    let html = `<div class="panel">
      <div class="panel-body" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
        <div id="activeFilterChips" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
        <div style="display:flex; gap:8px;">
          <button class="btn" id="openFiltersBtn">Filters</button>
          <button class="btn btn-outline" id="clearFiltersBtn">Clear All Filters</button>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="panel-title" id="reportsCountLabel">All Entries</span></div>
      <div class="panel-body" style="padding:0" id="reportsTableArea"></div>
    </div>`;

    document.getElementById('tab-reports').innerHTML = html;

    document.getElementById('openFiltersBtn').addEventListener('click', openFiltersModal);
    document.getElementById('clearFiltersBtn').addEventListener('click', () => {
      activeFilters = { employee: '', vehicle: '', status: '', from: '', to: '' };
      applyReportFilters();
    });

    applyReportFilters();
  }

  function openFiltersModal() {
    const employeeOptions = dashboardData.employees.map(e => `<option value="${e.id}" ${activeFilters.employee === e.id ? 'selected' : ''}>${e.name}</option>`).join('');
    const vehicleOptions = dashboardData.vehicles.map(v => `<option value="${v.id}" ${activeFilters.vehicle === v.id ? 'selected' : ''}>${v.vehicle_name}</option>`).join('');
    const statusOpts = ['pending_evening','calculated','approved','rejected','paid'].map(s => `<option value="${s}" ${activeFilters.status === s ? 'selected' : ''}>${s.replace('_',' ')}</option>`).join('');

    const modalHtml = `
      <div class="auth-card" style="max-width:420px" onclick="event.stopPropagation()">
        <p class="auth-title" style="margin-bottom:14px;">Filter Entries</p>
        <div class="form-grid">
          <div class="field"><label>Employee</label><select id="modalFilterEmployee"><option value="">All employees</option>${employeeOptions}</select></div>
          <div class="field"><label>Vehicle</label><select id="modalFilterVehicle"><option value="">All vehicles</option>${vehicleOptions}</select></div>
          <div class="field"><label>Status</label><select id="modalFilterStatus"><option value="">All statuses</option>${statusOpts}</select></div>
          <div class="field"></div>
          <div class="field"><label>From Date</label><input type="date" id="modalFilterFrom" value="${activeFilters.from}" /></div>
          <div class="field"><label>To Date</label><input type="date" id="modalFilterTo" value="${activeFilters.to}" /></div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-outline" id="modalCancelBtn" style="flex:1">Cancel</button>
          <button class="btn" id="modalApplyBtn" style="flex:1">Apply Filters</button>
        </div>
      </div>`;

    let modal = document.getElementById('filtersModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.className = 'lightbox';
      modal.id = 'filtersModal';
      document.body.appendChild(modal);
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
    }
    modal.innerHTML = modalHtml;
    modal.classList.add('open');

    document.getElementById('modalCancelBtn').addEventListener('click', () => modal.classList.remove('open'));
    document.getElementById('modalApplyBtn').addEventListener('click', () => {
      activeFilters = {
        employee: document.getElementById('modalFilterEmployee').value,
        vehicle: document.getElementById('modalFilterVehicle').value,
        status: document.getElementById('modalFilterStatus').value,
        from: document.getElementById('modalFilterFrom').value,
        to: document.getElementById('modalFilterTo').value,
      };
      modal.classList.remove('open');
      applyReportFilters();
    });
  }

  function applyReportFilters() {
    const chipsArea = document.getElementById('activeFilterChips');
    const chips = [];
    if (activeFilters.employee) {
      const emp = dashboardData.employees.find(e => e.id === activeFilters.employee);
      chips.push(`Employee: ${emp ? emp.name : '—'}`);
    }
    if (activeFilters.vehicle) {
      const veh = dashboardData.vehicles.find(v => v.id === activeFilters.vehicle);
      chips.push(`Vehicle: ${veh ? veh.vehicle_name : '—'}`);
    }
    if (activeFilters.status) chips.push(`Status: ${activeFilters.status.replace('_',' ')}`);
    if (activeFilters.from) chips.push(`From: ${activeFilters.from}`);
    if (activeFilters.to) chips.push(`To: ${activeFilters.to}`);

    chipsArea.innerHTML = chips.length === 0
      ? '<span style="color:var(--muted); font-size:12.5px;">No filters applied</span>'
      : chips.map(c => `<span class="role-tag" style="font-size:11px;">${c}</span>`).join('');

    const filtered = dashboardData.entries.filter(e => {
      if (activeFilters.employee && e.employee_id !== activeFilters.employee) return false;
      if (activeFilters.vehicle && e.vehicle_id !== activeFilters.vehicle) return false;
      if (activeFilters.status && e.status !== activeFilters.status) return false;
      if (activeFilters.from && e.entry_date < activeFilters.from) return false;
      if (activeFilters.to && e.entry_date > activeFilters.to) return false;
      return true;
    });

    document.getElementById('reportsCountLabel').textContent = `${filtered.length} Entr${filtered.length === 1 ? 'y' : 'ies'}`;
    document.getElementById('reportsTableArea').innerHTML = filtered.length === 0
      ? '<div class="empty-state">No entries match these filters.</div>'
      : buildTable(filtered, false);
  }

  function renderEmployees() {
    let html = `<div class="panel">
      <div class="panel-header"><span class="panel-title">Add Employee</span></div>
      <div class="panel-body">
        <div class="form-grid">
          <div class="field"><label>Name</label><input id="newEmpName" /></div>
          <div class="field"><label>Mobile Number</label><input id="newEmpMobile" /></div>
          <div class="field"><label>PIN (4-6 digits)</label><input id="newEmpPin" type="password" /></div>
          <div class="field"><label>Role</label><select id="newEmpRole"><option value="employee">Employee</option><option value="admin">Admin</option></select></div>
          <div class="field full"><label>Rate per KM (only if employee owns their vehicle)</label><input id="newEmpRate" type="number" placeholder="Optional" /></div>
        </div>
        <button class="btn" id="addEmpBtn">Add Employee</button>
        <div class="msg" id="addEmpMsg"></div>
      </div>
    </div>`;

    html += `<div class="panel"><div class="panel-header"><span class="panel-title">All Employees</span></div><div class="panel-body">`;
    if (dashboardData.employees.length === 0) html += '<div class="empty-state">No employees yet.</div>';
    dashboardData.employees.forEach(emp => {

  function renderPayments() {
    // Group APPROVED (unpaid) entries by employee + month
    const owedGroups = {};
    dashboardData.entries.filter(e => e.status === 'approved').forEach(e => {
      const [year, month] = e.entry_date.split('-');
      const key = `${e.employee_id}_${year}_${month}`;
      if (!owedGroups[key]) {
        owedGroups[key] = { employee_id: e.employee_id, year: Number(year), month: Number(month), km: 0, cost: 0, count: 0 };
      }
      owedGroups[key].km += Number(e.km_traveled || 0);
      owedGroups[key].cost += Number(e.cost || 0);
      owedGroups[key].count += 1;
    });

    const monthNames = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    let owedRows = '';
    Object.values(owedGroups).forEach(g => {
      const emp = dashboardData.employees.find(e => e.id === g.employee_id);
      owedRows += `<div class="roster-item">
        <div>
          <div class="roster-name">${emp ? emp.name : '—'}</div>
          <div class="roster-meta">${monthNames[g.month]} ${g.year} · ${g.count} entr${g.count === 1 ? 'y' : 'ies'} · ${g.km} km</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="num-cell">₹${g.cost.toFixed(2)}</span>
          <button class="btn btn-sm mark-paid-btn" data-emp="${g.employee_id}" data-month="${g.month}" data-year="${g.year}">Mark as Paid</button>
        </div>
      </div>`;
    });

    let historyRows = '';
    (dashboardData.paymentBatches || []).forEach(b => {
      historyRows += `<div class="roster-item">
        <div>
          <div class="roster-name">${b.employees?.name || '—'}</div>
          <div class="roster-meta">${monthNames[b.period_month]} ${b.period_year} · ${b.total_km} km · Paid ${b.paid_at ? new Date(b.paid_at).toLocaleDateString() : ''}</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="num-cell">₹${Number(b.total_cost).toFixed(2)}</span>
          <button class="btn btn-sm btn-outline view-slip-btn" data-batch="${b.id}">View Slip</button>
        </div>
      </div>`;
    });

    let html = `<div class="panel">
      <div class="panel-header header-pending"><span class="panel-title">Amount Owed<span class="count-chip">${Object.keys(owedGroups).length}</span></span></div>
      <div class="panel-body">${Object.keys(owedGroups).length === 0 ? '<div class="empty-state">Nothing owed right now — all approved entries have been paid.</div>' : owedRows}</div>
    </div>
    <div class="panel">
      <div class="panel-header header-recent"><span class="panel-title">Payment History</span></div>
      <div class="panel-body">${historyRows === '' ? '<div class="empty-state">No payments recorded yet.</div>' : historyRows}</div>
    </div>`;

    document.getElementById('tab-payments').innerHTML = html;

    document.querySelectorAll('.mark-paid-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Mark this period as paid? This will generate a payment slip and cannot be undone.')) return;
        setButtonLoading(btn, true, 'Processing', 'Mark as Paid');
        const res = await apiAdmin({ action: 'mark_paid', employee_id: btn.dataset.emp, period_month: Number(btn.dataset.month), period_year: Number(btn.dataset.year) });
        if (res.success) {
          loadDashboard();
        } else {
          alert(res.error || 'Failed to mark as paid');
          setButtonLoading(btn, false, null, 'Mark as Paid');
        }
      });
    });

    document.querySelectorAll('.view-slip-btn').forEach(btn => {
      btn.addEventListener('click', () => printSlip(btn.dataset.batch));
    });
  }

  function printSlip(batchId) {
    const batch = (dashboardData.paymentBatches || []).find(b => b.id === batchId);
    if (!batch) { alert('Slip not found'); return; }
    const entries = dashboardData.entries.filter(e => e.payment_batch_id === batchId).sort((a,b) => a.entry_date.localeCompare(b.entry_date));
    const monthNames = ['','January','February','March','April','May','June','July','August','September','October','November','December'];

    let rows = entries.map(e => `<tr>
      <td style="padding:6px 10px; border:1px solid #ccc;">${e.entry_date}</td>
      <td style="padding:6px 10px; border:1px solid #ccc;">${e.vehicles?.vehicle_name || ''}</td>
      <td style="padding:6px 10px; border:1px solid #ccc; text-align:right;">${e.km_traveled}</td>
      <td style="padding:6px 10px; border:1px solid #ccc; text-align:right;">₹${e.rate_applied}</td>
      <td style="padding:6px 10px; border:1px solid #ccc; text-align:right;">₹${e.cost}</td>
    </tr>`).join('');

    const html = `<!DOCTYPE html><html><head><title>Payment Slip</title>
    <style>body{font-family:Arial,sans-serif; padding:30px; color:#1a2229;} h1{font-size:18px; margin-bottom:2px;} table{border-collapse:collapse; width:100%; margin-top:16px;} th{background:#eee; padding:6px 10px; border:1px solid #ccc; text-align:left;} .total{font-weight:bold; font-size:15px; margin-top:14px; text-align:right;}</style>
    </head><body>
      <h1>REF — Raghbir Erectors &amp; Fabricators</h1>
      <p style="color:#666; margin-top:0;">Vehicle KM Payment Slip</p>
      <p><strong>Employee:</strong> ${batch.employees?.name || ''}<br/>
      <strong>Period:</strong> ${monthNames[batch.period_month]} ${batch.period_year}<br/>
      <strong>Paid on:</strong> ${batch.paid_at ? new Date(batch.paid_at).toLocaleString() : ''}</p>
      <table><thead><tr><th>Date</th><th>Vehicle</th><th style="text-align:right;">KM</th><th style="text-align:right;">Rate</th><th style="text-align:right;">Amount</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <div class="total">Total KM: ${batch.total_km} &nbsp;|&nbsp; Total Paid: ₹${Number(batch.total_cost).toFixed(2)}</div>
      <p style="color:#999; font-size:11px; margin-top:30px;">Generated ${new Date().toLocaleString()}</p>
    </body></html>`;

    const w = window.open('', '_blank');
    w.document.write(html);
    w.document.close();
    w.onload = () => { w.focus(); w.print(); };
  }

  // ============ HR DROPDOWNS ============
  const DROPDOWN_CONFIG = [
    { table: 'branches', label: 'Branch' },
    { table: 'departments', label: 'Department' },
    { table: 'designations', label: 'Designation' },
    { table: 'employee_categories', label: 'Employee Category' },
    { table: 'relationships', label: 'Relationship' },
    { table: 'asset_types', label: 'Asset Type' },
  ];
  let activeDropdownTab = DROPDOWN_CONFIG[0].table;

  function renderHRDropdowns() {
    if (!dropdownsData) {
      document.getElementById('hrtab-hr-dropdowns').innerHTML = '<div class="empty-state">Loading...</div>';
      return;
    }

    let tabsHtml = `<div class="subtabs" id="ddTabsNav" style="padding-left:18px;">`;
    DROPDOWN_CONFIG.forEach(cfg => {
      tabsHtml += `<button class="subtab-item ${cfg.table === activeDropdownTab ? 'active' : ''}" data-ddtab="${cfg.table}">${cfg.label}</button>`;
    });
    tabsHtml += `</div>`;

    let panelsHtml = '';
    DROPDOWN_CONFIG.forEach(cfg => {
      const items = dropdownsData[cfg.table] || [];
      panelsHtml += `<div class="ddtab-content" id="ddtab-${cfg.table}" style="${cfg.table === activeDropdownTab ? '' : 'display:none'}">
        <div class="panel">
          <div class="panel-header"><span class="panel-title">${cfg.label} Master<span class="count-chip">${items.length}</span></span></div>
          <div class="panel-body">
            <div class="form-grid" style="align-items:end; margin-bottom:14px;">
              <div class="field"><label>${cfg.label} Name</label><input type="text" class="dd-name-input" data-table="${cfg.table}" /></div>
              <div class="field"><button class="btn dd-add-btn" data-table="${cfg.table}">Add</button></div>
            </div>
            <div class="msg" id="dd-msg-${cfg.table}"></div>
            <div class="table-scroll">
              <table class="ledger"><thead><tr>
                <th>Name</th><th>Status</th><th>Action</th>
              </tr></thead><tbody>
                ${items.length === 0 ? `<tr><td colspan="3" style="text-align:center; color:var(--muted); padding:16px;">No ${cfg.label.toLowerCase()}s yet.</td></tr>` : items.map(item => `
                  <tr class="${item.is_active ? 'row-approved' : 'row-open'}">
                    <td data-label="Name">${item.name}</td>
                    <td data-label="Status"><span class="status-tag ${item.is_active ? 'approved' : 'pending_evening'}">${item.is_active ? 'Active' : 'Inactive'}</span></td>
                    <td data-label="Action" class="action-cell">
                      <div style="display:flex; gap:4px;">
                        <button class="icon-btn dd-rename-btn" data-table="${cfg.table}" data-id="${item.id}" data-name="${item.name}" title="Rename">${ACTION_ICONS.edit}</button>
                        <button class="btn btn-sm btn-outline dd-toggle-btn" data-table="${cfg.table}" data-id="${item.id}" data-active="${item.is_active}">${item.is_active ? 'Deactivate' : 'Activate'}</button>
                        <button class="icon-btn icon-btn-danger dd-delete-btn" data-table="${cfg.table}" data-id="${item.id}" title="Delete Permanently">${ACTION_ICONS.exit}</button>
                      </div>
                    </td>
                  </tr>`).join('')}
              </tbody></table>
            </div>
          </div>
        </div>
      </div>`;
    });

    document.getElementById('hrtab-hr-dropdowns').innerHTML = tabsHtml + panelsHtml;

    document.querySelectorAll('#ddTabsNav .subtab-item').forEach(btn => {
      btn.addEventListener('click', () => {
        activeDropdownTab = btn.dataset.ddtab;
        document.querySelectorAll('#ddTabsNav .subtab-item').forEach(b => b.classList.toggle('active', b === btn));
        document.querySelectorAll('.ddtab-content').forEach(c => c.style.display = 'none');
        document.getElementById('ddtab-' + btn.dataset.ddtab).style.display = 'block';
      });
    });

    document.querySelectorAll('.dd-add-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const table = btn.dataset.table;
        const nameInput = document.querySelector(`.dd-name-input[data-table="${table}"]`);
        const msg = document.getElementById(`dd-msg-${table}`);
        msg.className = 'msg';
        const fields = { name: nameInput.value.trim() };
        if (!fields.name) { msg.className = 'msg error'; msg.textContent = 'Name is required.'; return; }

        const calcType = document.querySelector(`.dd-calc-type[data-table="${table}"]`);
        const valueInput = document.querySelector(`.dd-value-input[data-table="${table}"]`);
        if (calcType) fields.calculation_type = calcType.value;
        if (valueInput) fields.value = valueInput.value;

        setButtonLoading(btn, true, 'Adding');
        const res = await apiHR({ action: 'add_dropdown_item', table, fields });
        if (res.success) {
          dropdownsData[table] = dropdownsData[table] || [];
          dropdownsData[table].push(res.item);
          renderHRDropdowns();
        } else {
          setButtonLoading(btn, false);
          msg.className = 'msg error';
          msg.textContent = res.error || 'Failed to add.';
        }
      });
    });

    document.querySelectorAll('.dd-toggle-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        setButtonLoading(btn, true, 'Updating');
        const res = await apiHR({
          action: 'toggle_dropdown_item',
          table: btn.dataset.table,
          id: btn.dataset.id,
          is_active: btn.dataset.active !== 'true',
        });
        if (res.success) {
          const idx = dropdownsData[btn.dataset.table].findIndex(i => i.id === btn.dataset.id);
          if (idx >= 0) dropdownsData[btn.dataset.table][idx] = res.item;
          renderHRDropdowns();
        } else {
          setButtonLoading(btn, false);
          alert(res.error || 'Failed to update.');
        }
      });
    });

    document.querySelectorAll('.dd-rename-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const newName = prompt('Rename to:', btn.dataset.name);
        if (!newName || !newName.trim() || newName.trim() === btn.dataset.name) return;
        const res = await apiHR({ action: 'rename_dropdown_item', table: btn.dataset.table, id: btn.dataset.id, new_name: newName.trim() });
        if (res.success) {
          const idx = dropdownsData[btn.dataset.table].findIndex(i => i.id === btn.dataset.id);
          if (idx >= 0) dropdownsData[btn.dataset.table][idx] = res.item;
          renderHRDropdowns();
        } else {
          alert(res.error || 'Failed to rename.');
        }
      });
    });

    document.querySelectorAll('.dd-delete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Permanently delete this item? This cannot be undone.')) return;
        const res = await apiHR({ action: 'delete_dropdown_item', table: btn.dataset.table, id: btn.dataset.id });
        if (res.success) {
          dropdownsData[btn.dataset.table] = dropdownsData[btn.dataset.table].filter(i => i.id !== btn.dataset.id);
          renderHRDropdowns();
        } else {
          alert(res.error || 'Failed to delete.');
        }
      });
    });
  }

  function renderViewRepeatable(rows, fieldPairs) {
    if (!rows || rows.length === 0) return '<div class="empty-state">None recorded.</div>';
    return rows.map(row => `
      <div class="form-grid" style="border:1px solid var(--border); border-radius:6px; padding:12px; margin-bottom:10px;">
        ${fieldPairs.map(([key, label]) => {
          const val = key.includes('.') ? row[key.split('.')[0]]?.[key.split('.')[1]] : row[key];
          return viewField(label, val);
        }).join('')}
      </div>`).join('');
  }

  async function quickStatusChange(employeeId, newStatus, label) {
    if (!confirm(`Are you sure you want to ${label} this employee?`)) return;
    const res = await apiHR({ action: 'update_employee_status', employee_id: employeeId, new_status: newStatus });
    if (res.success) {
      const idx = employeeListData.findIndex(x => x.id === employeeId);
      if (idx >= 0) employeeListData[idx].status = res.employee.status;
      openEmployeeView(employeeId);
    } else {
      alert(res.error || 'Failed to update status.');
    }
  }

        <div id="etab-work" class="etab-content" style="display:none">

        <div id="etab-nominee" class="etab-content" style="display:none">

          <p class="section-label">Nominee</p>

        </div>

        <div id="etab-assets" class="etab-content" style="display:none">

        </div>

        <div style="margin-top:20px; display:flex; gap:10px;">
          <button class="btn" id="saveEmployeeBtn">${employeeId ? 'Save Changes' : 'Create Employee'}</button>
          <button class="btn btn-outline" id="cancelEmployeeBtn" type="button">Cancel</button>
        </div>
        <div class="msg" id="employeeFormMsg"></div>

    </div>`;

    document.getElementById('hrtab-employee-master').innerHTML = html;

    // Sub-tab switching within the form
    document.querySelectorAll('#empFormSubtabs .subtab-item').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#empFormSubtabs .subtab-item').forEach(b => b.classList.toggle('active', b === btn));
        document.querySelectorAll('.etab-content').forEach(c => c.style.display = 'none');
        document.getElementById('etab-' + btn.dataset.etab).style.display = 'block';

    // PF/ESI conditional fields
    document.getElementById('f_pf_applicable').addEventListener('change', (ev) => {
      document.getElementById('pfNumberField').style.display = ev.target.checked ? 'block' : 'none';
    });
    document.getElementById('f_esi_applicable').addEventListener('change', (ev) => {
      document.getElementById('esiNumberField').style.display = ev.target.checked ? 'block' : 'none';
    });

    // Vehicle KM conditional field
    document.getElementById('f_vehicle_km_applicable').addEventListener('change', (ev) => {
      document.getElementById('vehicleDetailsField').style.display = ev.target.checked ? 'grid' : 'none';
    });
    document.getElementById('copyLinkBtn')?.addEventListener('click', () => {
      navigator.clipboard.writeText('https://km.refconveyors.net');
      const b = document.getElementById('copyLinkBtn');
      b.textContent = 'Copied!';
      setTimeout(() => b.textContent = 'Copy', 1500);

    // Father/Husband relation prefix changes the field label dynamically
    function updateRelationLabel() {
      const rel = document.getElementById('f_father_husband_relation').value;
      document.getElementById('fatherHusbandLabel').textContent = rel === 'W/o' ? 'Husband Name' : 'Father Name';
    }
    document.getElementById('f_father_husband_relation').addEventListener('change', updateRelationLabel);
    updateRelationLabel();

    // State -> City dependent dropdowns
    function populateCitiesForState(stateSelectId, citySelectId, selectedCityId) {
      const stateId = document.getElementById(stateSelectId).value;
      const citySelect = document.getElementById(citySelectId);
      const filtered = (dd.cities || []).filter(c => c.state_id === stateId);
      citySelect.innerHTML = opt(filtered, selectedCityId);
    }
    document.getElementById('f_present_state_id').addEventListener('change', () => populateCitiesForState('f_present_state_id', 'f_present_city_id', null));
    document.getElementById('f_permanent_state_id').addEventListener('change', () => populateCitiesForState('f_permanent_state_id', 'f_permanent_city_id', null));

    // Same-as-present-address checkbox
    document.getElementById('f_same_as_present').addEventListener('change', (ev) => {
      const fieldsWrap = document.getElementById('permanentAddressFields');
      if (ev.target.checked) {
        document.getElementById('f_permanent_address').value = document.getElementById('f_present_address').value;
        document.getElementById('f_permanent_state_id').value = document.getElementById('f_present_state_id').value;
        populateCitiesForState('f_permanent_state_id', 'f_permanent_city_id', document.getElementById('f_present_city_id').value);
        document.getElementById('f_permanent_pincode').value = document.getElementById('f_present_pincode').value;
        fieldsWrap.querySelectorAll('input, select').forEach(el => el.disabled = true);
      } else {
        fieldsWrap.querySelectorAll('input, select').forEach(el => el.disabled = false);
      }
    });

    // Repeatable child-record sections
    setupRepeatableSection('familyRows', 'addFamilyRowBtn', detail?.family || [], [
      { key: 'member_name', label: 'Name' },
      { key: 'relationship_id', label: 'Relationship', type: 'select', options: dd.relationships },
      { key: 'age', label: 'Age', type: 'number' },
      { key: 'is_dependent', label: 'Dependent', type: 'checkbox' },
      { key: 'occupation', label: 'Occupation' },
    ]);
    setupRepeatableSection('educationRows', 'addEducationRowBtn', detail?.education || [], [
      { key: 'qualification', label: 'Qualification' },
      { key: 'institute_name', label: 'Institute' },
      { key: 'board_university', label: 'Board/University' },
      { key: 'passing_year', label: 'Passing Year' },
      { key: 'percentage', label: 'Percentage' },
    ]);
    setupRepeatableSection('workRows', 'addWorkRowBtn', detail?.workExperience || [], [
      { key: 'company_name', label: 'Company' },
      { key: 'duration', label: 'Duration' },
      { key: 'position', label: 'Position' },
      { key: 'reason_for_leaving', label: 'Reason for Leaving' },
    ]);
    setupRepeatableSection('nomineeRows', 'addNomineeRowBtn', detail?.nominees || [], [
      { key: 'name', label: 'Name' },
      { key: 'relation', label: 'Relation' },
      { key: 'dob_or_age', label: 'DOB/Age' },
      { key: 'address', label: 'Address' },
      { key: 'mobile', label: 'Mobile' },
    ]);
    setupRepeatableSection('assetRows', 'addAssetRowBtn', detail?.assets || [], [
      { key: 'asset_type_id', label: 'Asset Type', type: 'select', options: dd.asset_types },
      { key: 'asset_details', label: 'Details' },
      { key: 'given_date', label: 'Given Date', type: 'date' },
      { key: 'returned_date', label: 'Returned Date', type: 'date' },
    ]);

    document.getElementById('formBackBtn').addEventListener('click', () => renderEmployeeMasterList());

    document.getElementById('cancelEmployeeBtn').addEventListener('click', () => {
      renderEmployeeMasterList();
    });

    document.getElementById('saveEmployeeBtn').addEventListener('click', () => saveEmployeeForm(employeeId));
  }

  function setupRepeatableSection(containerId, addBtnId, initialRows, fields) {
    const container = document.getElementById(containerId);
    let rows = initialRows.length > 0 ? [...initialRows] : [];

    function render() {
      container.innerHTML = rows.map((row, idx) => `
        <div class="form-grid repeat-row" data-idx="${idx}" style="border:1px solid var(--border); border-radius:6px; padding:12px; margin-bottom:10px; position:relative;">
          ${fields.map(f => {
            const val = row[f.key] ?? '';
            if (f.type === 'select') {
              return `<div class="field"><label>${f.label}</label><select data-key="${f.key}">${opt(f.options, val)}</select></div>`;
            }
            if (f.type === 'checkbox') {
              return `<div class="field"><label><input type="checkbox" data-key="${f.key}" ${val ? 'checked' : ''} style="width:auto; margin-right:6px;" />${f.label}</label></div>`;
            }
            return `<div class="field"><label>${f.label}</label><input type="${f.type || 'text'}" data-key="${f.key}" value="${val}" /></div>`;
          }).join('')}
          <button type="button" class="btn btn-sm btn-danger remove-row-btn" style="align-self:end;">Remove</button>
        </div>`).join('');

      container.querySelectorAll('.remove-row-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.closest('.repeat-row').dataset.idx);
          syncRowsFromDOM();
          rows.splice(idx, 1);
          render();
        });
      });
    }

    function syncRowsFromDOM() {
      container.querySelectorAll('.repeat-row').forEach((rowEl, idx) => {
        fields.forEach(f => {
          const input = rowEl.querySelector(`[data-key="${f.key}"]`);
          if (!input) return;
          rows[idx][f.key] = f.type === 'checkbox' ? input.checked : input.value;
        });
      });
    }

    document.getElementById(addBtnId).addEventListener('click', () => {
      syncRowsFromDOM();
      rows.push({});
      render();
    });

    container.getRows = () => { syncRowsFromDOM(); return rows; };
    render();
  }

  async function saveEmployeeForm(employeeId) {
    const btn = document.getElementById('saveEmployeeBtn');
    const msg = document.getElementById('employeeFormMsg');
    msg.className = 'msg';

    const val = (id) => document.getElementById(id)?.value || null;
    const checked = (id) => document.getElementById(id)?.checked || false;

    const core = {
      employee_code: val('f_employee_code'),
      name: val('f_name'),
      mobile_number: val('f_mobile_number'),
      role: val('f_role'),
      branch_id: val('f_branch_id') || null,
      department_id: val('f_department_id') || null,
      designation_id: val('f_designation_id') || null,
      employee_category_id: val('f_employee_category_id') || null,
      date_of_joining: val('f_date_of_joining'),
      wage_type: val('f_wage_type'),
      father_husband_name: val('f_father_husband_name'),
      marital_status: val('f_marital_status'),
      religion: val('f_religion'),
      gender: val('f_gender'),
      date_of_birth: val('f_date_of_birth'),
      blood_group: val('f_blood_group'),
      place_of_birth: val('f_place_of_birth'),
      aadhar_no: val('f_aadhar_no'),
      father_husband_relation: val('f_father_husband_relation'),
      present_address: val('f_present_address'),
      present_city_id: val('f_present_city_id') || null,
      present_state_id: val('f_present_state_id') || null,
      present_pincode: val('f_present_pincode'),
      permanent_address: val('f_permanent_address'),
      permanent_city_id: val('f_permanent_city_id') || null,
      permanent_state_id: val('f_permanent_state_id') || null,
      permanent_pincode: val('f_permanent_pincode'),
      tel_home: val('f_tel_home'),
      driving_license_number: val('f_driving_license_number'),
      driving_license_category: val('f_driving_license_category'),
      driving_license_validity: val('f_driving_license_validity'),
      emergency_contact_name: val('f_emergency_contact_name'),
      emergency_contact_relation: val('f_emergency_contact_relation'),
      emergency_contact_mobile: val('f_emergency_contact_mobile'),
      emergency_contact_address: val('f_emergency_contact_address'),
      bank_name: val('f_bank_name'),
      bank_account_number: val('f_bank_account_number'),
      bank_ifsc: val('f_bank_ifsc'),
      bank_branch: val('f_bank_branch'),
      bank_account_holder_name: val('f_bank_account_holder_name'),
      pan_number: val('f_pan_number'),
      uan_number: val('f_uan_number'),
      salary_basic: val('f_salary_basic'),
      salary_hra: val('f_salary_hra'),
      salary_da: val('f_salary_da'),
      salary_ta: val('f_salary_ta'),
      salary_esi: val('f_salary_esi'),
      pf_applicable: checked('f_pf_applicable'),
      pf_number: checked('f_pf_applicable') ? val('f_pf_number') : null,
      esi_applicable: checked('f_esi_applicable'),
      esi_number: checked('f_esi_applicable') ? val('f_esi_number') : null,
      vehicle_km_applicable: checked('f_vehicle_km_applicable'),
      vehicle_number: checked('f_vehicle_km_applicable') ? val('f_vehicle_number') : null,
      rate_per_km: checked('f_vehicle_km_applicable') ? val('f_rate_per_km') : null,
      has_ref_employee: checked('f_has_ref_employee'),
      ref_employee_name: val('f_ref_employee_name'),
      ref_employee_contact: val('f_ref_employee_contact'),
    };

    if (!core.employee_code) {
      msg.className = 'msg error';
      msg.textContent = 'Employee Code is required.';
      return;
    }
    if (!core.name || !core.mobile_number) {
      msg.className = 'msg error';
      msg.textContent = 'Name and mobile number are required.';
      return;
    }

    setButtonLoading(btn, true, 'Saving');

    let empResult;
    if (employeeId) {
      empResult = await apiHR({ action: 'update_employee', employee_id: employeeId, core });
    } else {
      empResult = await apiHR({ action: 'create_employee', core, pin: null });
    }

    if (!empResult.success) {
      msg.className = 'msg error';
      msg.textContent = empResult.error || 'Failed to save employee.';
      setButtonLoading(btn, false);
      return;
    }

    const finalEmployeeId = empResult.employee.id;

    // Save all child record sections
    const childSaves = [
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_family_members', records: document.getElementById('familyRows').getRows() }),
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_education', records: document.getElementById('educationRows').getRows() }),
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_work_experience', records: document.getElementById('workRows').getRows() }),
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_nominees', records: document.getElementById('nomineeRows').getRows() }),
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_assets', records: document.getElementById('assetRows').getRows() }),
    ];
    await Promise.all(childSaves);

    msg.className = 'msg success';
    msg.textContent = empResult.generatedPin
      ? `Employee saved successfully. Their login PIN is: ${empResult.generatedPin} (last 4 digits of mobile number). Share this with them.`
      : 'Employee saved successfully.';
    const listRes = await apiHR({ action: 'get_employee_list' });
    if (listRes.success) employeeListData = listRes.employees;
    setTimeout(() => renderEmployeeMasterList(), empResult.generatedPin ? 3500 : 800);
  }
</script>
