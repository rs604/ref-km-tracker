<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vehicle KM Tracker — Login</title>
<script>window.__BUILD_VERSION__ = '1786609596';</script>
<script>
(function() {
  function checkVersion() {
    fetch('version.txt?_=' + Date.now(), { cache: 'no-store' })
      .then(function(r) { return r.text(); })
      .then(function(v) {
        v = v.trim();
        if (v && v !== window.__BUILD_VERSION__) {
          window.location.href = window.location.pathname + '?_v=' + Date.now();
        }
      })
      .catch(function() {
        setTimeout(checkVersion, 8000);
      });
  }
  checkVersion();
  setInterval(checkVersion, 60000);
  window.addEventListener('focus', checkVersion);
  window.addEventListener('online', checkVersion);
  document.addEventListener('visibilitychange', function() { if (!document.hidden) checkVersion(); });
})();
</script>
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --line: #dde2e8;
    --primary: #3b5b74;
    --primary-dark: #2c4457;
    --text: #263238;
    --muted: #6b7684;
    --danger: #a5453a;
    --danger-bg: #fbeceb;
    --success: #3a7a5d;
    --success-bg: #eaf5ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 34px 28px 28px;
    box-shadow: 0 1px 3px rgba(38,50,56,0.06), 0 8px 24px rgba(38,50,56,0.04);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--primary);
    font-weight: 600;
    margin: 0 0 10px;
  }
  .badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary);
    display: inline-block;
  }
  h1 {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.2px;
    margin: 0 0 6px;
    color: var(--text);
  }
  .sub {
    color: var(--muted);
    font-size: 13.5px;
    margin: 0 0 26px;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    margin: 0 0 6px;
    font-weight: 500;
  }
  .field { margin-bottom: 16px; }
  input {
    width: 100%;
    background: #fafbfc;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 15.5px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  input:focus { border-color: var(--primary); background: #fff; }
  input::placeholder { color: #a3aab3; }

  button {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--primary-dark); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .msg {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    display: none;
    line-height: 1.5;
  }
  .msg.error {
    display: block;
    background: var(--danger-bg);
    border: 1px solid #f0d3d0;
    color: var(--danger);
  }
  .msg.success {
    display: block;
    background: var(--success-bg);
    border: 1px solid #cfe6da;
    color: var(--success);
  }
  .footer-note {
    text-align: center;
    font-size: 11.5px;
    color: #a3aab3;
    margin-top: 20px;
  }
  .simple-brand {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--primary);
    margin-bottom: 10px;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="simple-brand">REF</div>
    <p class="badge">Fleet Access</p>
    <h1>Log In</h1>
    <p class="sub">Enter your registered mobile number and PIN to continue.</p>

    <form id="loginForm">
      <div class="field">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" placeholder="10-digit mobile number" inputmode="numeric" maxlength="10" required />
      </div>
      <div class="field">
        <label for="pin">PIN</label>
        <input type="password" id="pin" placeholder="4–6 digit PIN" inputmode="numeric" maxlength="6" required />
      </div>
      <button type="submit" id="submitBtn">Log In</button>
    </form>

    <div class="msg" id="msgBox"></div>
    <p class="footer-note">Access is restricted to registered team numbers only.</p>
  </div>

<script>
  const SUPABASE_URL = "https://mamamjohuuacxezcwgqv.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_uqu742FOxl_J1VqWOsrtjw_-Ja4QfNa";

  const form = document.getElementById('loginForm');
  const msgBox = document.getElementById('msgBox');
  const submitBtn = document.getElementById('submitBtn');
  const mobileInput = document.getElementById('mobile');
  const pinInput = document.getElementById('pin');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgBox.className = 'msg';
    msgBox.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Checking...';

    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/login`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({
          mobile_number: mobileInput.value.trim(),
          pin: pinInput.value.trim()
        })
      });

      const data = await res.json();

      if (res.ok && data.success) {
        msgBox.className = 'msg success';
        msgBox.textContent = `Welcome, ${data.employee.name}. Redirecting...`;
        sessionStorage.setItem('employee_id', data.employee.id);
        sessionStorage.setItem('employee_name', data.employee.name);
        sessionStorage.setItem('employee_role', data.employee.role);
        setTimeout(() => { window.location.href = 'submit.html'; }, 800);
      } else {
        msgBox.className = 'msg error';
        msgBox.textContent = data.error || 'Login failed. Please try again.';
      }
    } catch (err) {
      msgBox.className = 'msg error';
      msgBox.textContent = 'Could not reach the server. Check your connection and try again.';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
    }
  });
</script>
</body>
</html>
